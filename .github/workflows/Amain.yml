          - (NSInteger)tableView:(UITableView *)tv numberOfRowsInSection:(NSInteger)s {
              return (NSInteger)[VioletTweakStore sharedStore].tweaks.count;
          }

          - (UITableViewCell *)tableView:(UITableView *)tv
                   cellForRowAtIndexPath:(NSIndexPath *)ip {
              UITableViewCell *cell = [tv dequeueReusableCellWithIdentifier:kCell
                                                               forIndexPath:ip];
              VioletTweak *tweak = [VioletTweakStore sharedStore].tweaks[(NSUInteger)ip.row];
              cell.textLabel.text       = tweak.title;
              cell.detailTextLabel.text = tweak.subtitle;
              cell.textLabel.textColor       = UIColor.whiteColor;
              cell.detailTextLabel.textColor = UIColor.lightGrayColor;
              cell.backgroundColor = UIColor.clearColor;

              UISwitch *sw = [[UISwitch alloc] init];
              sw.on         = tweak.isEnabled;
              sw.onTintColor = [UIColor colorWithRed:0.545 green:0.361 blue:0.965 alpha:1.0];
              sw.tag        = ip.row;
              [sw addTarget:self action:@selector(_toggle:)
                   forControlEvents:UIControlEventValueChanged];
              cell.accessoryView = sw;
              return cell;
          }

          - (void)_toggle:(UISwitch *)sw {
              VioletTweakStore *store = [VioletTweakStore sharedStore];
              VioletTweak *tweak = store.tweaks[(NSUInteger)sw.tag];
              tweak.isEnabled = sw.isOn;
              BOOL ok = [store applyTweak:tweak];
              if (!ok) {
                  UIAlertController *alert =
                      [UIAlertController alertControllerWithTitle:@"Failed"
                          message:@"Could not apply tweak. worse_query may be unavailable."
                          preferredStyle:UIAlertControllerStyleAlert];
                  [alert addAction:[UIAlertAction actionWithTitle:@"OK"
                      style:UIAlertActionStyleDefault handler:nil]];
                  [self presentViewController:alert animated:YES completion:nil];
                  sw.on = !sw.isOn;
                  tweak.isEnabled = sw.isOn;
              }
          }

          @end
          """)

          # ── UI/Tabs/PairingViewController.h ─────────────────────────────
          w("Violet/UI/Tabs/PairingViewController.h", """\
          #pragma once
          #import <UIKit/UIKit.h>

          @interface PairingViewController : UIViewController
          @end
          """)

          # ── UI/Tabs/PairingViewController.m ─────────────────────────────
          w("Violet/UI/Tabs/PairingViewController.m", """\
          #import "PairingViewController.h"
          #import "TransportManager.h"
          #import <UniformTypeIdentifiers/UniformTypeIdentifiers.h>

          @interface PairingViewController () <UIDocumentPickerDelegate>
          @property (nonatomic, strong) UILabel  *statusLabel;
          @property (nonatomic, strong) UIButton *getPairingBtn;
          @property (nonatomic, strong) UIButton *importBtn;
          @property (nonatomic, strong) UIButton *connectBtn;
          @end

          static UIColor *kViolet2(void) {
              return [UIColor colorWithRed:0.545 green:0.361 blue:0.965 alpha:1.0];
          }

          @implementation PairingViewController

          - (void)viewDidLoad {
              [super viewDidLoad];
              self.title = @"Pairing";
              self.view.backgroundColor =
                  [UIColor colorWithRed:0.06 green:0.06 blue:0.09 alpha:1.0];
              [self _buildUI];
          }

          - (void)_buildUI {
              _statusLabel = [[UILabel alloc] init];
              _statusLabel.text          = @"Not connected";
              _statusLabel.textColor     = UIColor.lightGrayColor;
              _statusLabel.textAlignment = NSTextAlignmentCenter;
              _statusLabel.font          = [UIFont systemFontOfSize:14];

              _getPairingBtn = [self _makeBtn:@"Get Pairing File"
                                       action:@selector(_getPairing)];
              _importBtn     = [self _makeBtn:@"Import Pairing File"
                                       action:@selector(_importPairing)];
              _connectBtn    = [self _makeBtn:@"Connect"
                                       action:@selector(_connect)];

              UIStackView *sv = [[UIStackView alloc]
                                  initWithArrangedSubviews:@[
                                      _statusLabel,
                                      _getPairingBtn, _importBtn, _connectBtn]];
              sv.axis      = UILayoutConstraintAxisVertical;
              sv.spacing   = 16;
              sv.alignment = UIStackViewAlignmentCenter;
              sv.translatesAutoresizingMaskIntoConstraints = NO;
              [self.view addSubview:sv];
              [NSLayoutConstraint activateConstraints:@[
                  [sv.centerXAnchor constraintEqualToAnchor:self.view.centerXAnchor],
                  [sv.centerYAnchor constraintEqualToAnchor:self.view.centerYAnchor],
                  [sv.widthAnchor   constraintEqualToAnchor:self.view.widthAnchor
                                                 multiplier:0.8],
              ]];
          }

          - (UIButton *)_makeBtn:(NSString *)title action:(SEL)sel {
              UIButton *btn = [UIButton buttonWithType:UIButtonTypeSystem];
              [btn setTitle:title forState:UIControlStateNormal];
              [btn setTitleColor:UIColor.whiteColor forState:UIControlStateNormal];
              btn.backgroundColor = kViolet2();
              btn.layer.cornerRadius = 12;
              btn.contentEdgeInsets = UIEdgeInsetsMake(12, 24, 12, 24);
              [btn addTarget:self action:sel forControlEvents:UIControlEventTouchUpInside];
              return btn;
          }

          - (void)_getPairing {
              UIAlertController *a =
                  [UIAlertController alertControllerWithTitle:@"Get Pairing File"
                      message:@"1. Connect your iPhone to the same Wi-Fi.\n"
                               @"2. Go to Settings → Privacy & Security → Developer Mode.\n"
                               @"3. Tap 'Pair with [Violet]' — this generates the pairing file.\n"
                               @"4. Import it in the next step."
                      preferredStyle:UIAlertControllerStyleAlert];
              [a addAction:[UIAlertAction actionWithTitle:@"Got it"
                  style:UIAlertActionStyleDefault handler:nil]];
              [self presentViewController:a animated:YES completion:nil];
          }

          - (void)_importPairing {
              UTType *plistType = UTTypeData;
              UIDocumentPickerViewController *picker =
                  [[UIDocumentPickerViewController alloc]
                   initForOpeningContentTypes:@[plistType]];
              picker.delegate = self;
              [self presentViewController:picker animated:YES completion:nil];
          }

          - (void)documentPicker:(UIDocumentPickerViewController *)ctrl
              didPickDocumentsAtURLs:(NSArray<NSURL *> *)urls {
              NSURL *url = urls.firstObject;
              if (!url) return;
              [[TransportManager sharedManager] importPairingFileAtURL:url];
              self.statusLabel.text = @"Pairing file imported";
          }

          - (void)_connect {
              self.statusLabel.text = @"Connecting…";
              [[TransportManager sharedManager]
               connectWithCompletion:^(BOOL success, NSError *error) {
                  dispatch_async(dispatch_get_main_queue(), ^{
                      if (success) {
                          VioletTransport t =
                              [TransportManager sharedManager].activeTransport;
                          self.statusLabel.text =
                              t == VioletTransportAirlift
                                  ? @"✅ Connected via Airlift"
                                  : @"✅ Connected via worse_query";
                      } else {
                          self.statusLabel.text =
                              [NSString stringWithFormat:@"❌ %@",
                               error.localizedDescription];
                      }
                  });
              }];
          }

          @end
          """)

          # ── UI/Tabs/WalletViewController.h ───────────────────────────────
          w("Violet/UI/Tabs/WalletViewController.h", """\
