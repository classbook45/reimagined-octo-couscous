          #import "BQEscape.h"

          @implementation VioletTweakStore

          + (instancetype)sharedStore {
              static VioletTweakStore *s;
              static dispatch_once_t t;
              dispatch_once(&t, ^{ s = [[self alloc] init]; });
              return s;
          }

          - (instancetype)init {
              self = [super init];
              if (!self) return nil;
              _tweaks = [NSMutableArray array];
              [self _populate];
              return self;
