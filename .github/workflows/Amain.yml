          # ── Core/TransportManager.h ─────────────────────────────────────
          w("Violet/Core/TransportManager.h", """\
          #pragma once
          #import <Foundation/Foundation.h>

          typedef NS_ENUM(NSUInteger, VioletTransport) {
              VioletTransportNone    = 0,
              VioletTransportAirlift = 1,
              VioletTransportBQ      = 2,
          };

          @interface TransportManager : NSObject
          @property (nonatomic, assign, readonly) VioletTransport activeTransport;
          + (instancetype)sharedManager;
          - (void)connectWithCompletion:(void(^)(BOOL success, NSError *error))completion;
          - (void)importPairingFileAtURL:(NSURL *)url;
          - (BOOL)writeFile:(NSString *)remotePath data:(NSData *)data;
          - (NSData *)readFile:(NSString *)remotePath;
          @end
          """)

          # ── Core/TransportManager.m ─────────────────────────────────────
          w("Violet/Core/TransportManager.m", """\
          #import "TransportManager.h"
          #import "BQEscape.h"
          #import <Network/Network.h>

          // AirliftFFI.xcframework C interface
          extern void *airlift_session_new(const char *pairingPlistPath);
          extern void  airlift_session_free(void *session);
          extern int   airlift_write_file(void *session, const char *path,
                                          const uint8_t *buf, size_t len);
          extern int   airlift_read_file(void *session, const char *path,
                                         uint8_t **outBuf, size_t *outLen);
          extern void  airlift_free_buf(uint8_t *buf);

          static NSString *kAirliftHost = @"10.7.0.1"; // LocalDevVPN — NEVER 127.0.0.1
          static uint16_t  kAirliftPort = 49152;

          @interface TransportManager ()
          @property (nonatomic, assign) VioletTransport activeTransport;
          @property (nonatomic, assign) void *airliftSession;
          @end

          @implementation TransportManager

          + (instancetype)sharedManager {
              static TransportManager *s;
              static dispatch_once_t t;
              dispatch_once(&t, ^{ s = [[self alloc] init]; });
              return s;
          }

          - (instancetype)init {
              self = [super init];
              if (!self) return nil;
              _activeTransport = VioletTransportNone;
              _airliftSession  = NULL;
              return self;
          }

          - (void)connectWithCompletion:(void(^)(BOOL, NSError *))completion {
              [self _probeAirliftWithCompletion:^(BOOL alive) {
                  if (alive) {
                      NSString *pairingPath = [self _pairingFilePath];
                      if (pairingPath && [[NSFileManager defaultManager]
                                          fileExistsAtPath:pairingPath]) {
                          self.airliftSession = airlift_session_new(pairingPath.UTF8String);
                          if (self.airliftSession) {
                              self.activeTransport = VioletTransportAirlift;
                              completion(YES, nil);
                              return;
                          }
                      }
                  }
                  // Fallback to worse_query
                  BOOL ok = bq_escape(@"group.violet.wq");
                  self.activeTransport = ok ? VioletTransportBQ : VioletTransportNone;
                  completion(ok, ok ? nil : [NSError errorWithDomain:@"VioletTransport"
                      code:-1
                      userInfo:@{NSLocalizedDescriptionKey:
                          @"Neither airlift nor worse_query available"}]);
              }];
          }

          - (void)_probeAirliftWithCompletion:(void(^)(BOOL))completion {
              nw_endpoint_t ep = nw_endpoint_create_host(kAirliftHost.UTF8String,
                                                         [@(kAirliftPort) stringValue].UTF8String);
              nw_parameters_t params = nw_parameters_create_secure_tcp(
                  NW_PARAMETERS_DISABLE_PROTOCOL, NW_PARAMETERS_DEFAULT_CONFIGURATION);
              nw_connection_t conn = nw_connection_create(ep, params);
              __block BOOL fired = NO;
              dispatch_queue_t q = dispatch_get_global_queue(DISPATCH_QUEUE_PRIORITY_DEFAULT, 0);
              nw_connection_set_state_changed_handler(conn, ^(nw_connection_state_t state,
                                                              nw_error_t error) {
                  if (fired) return;
                  if (state == nw_connection_state_ready) {
                      fired = YES;
                      nw_connection_cancel(conn);
                      dispatch_async(dispatch_get_main_queue(), ^{ completion(YES); });
                  } else if (state == nw_connection_state_failed ||
                             state == nw_connection_state_cancelled) {
                      fired = YES;
                      dispatch_async(dispatch_get_main_queue(), ^{ completion(NO); });
                  }
              });
              nw_connection_set_queue(conn, q);
              nw_connection_start(conn);
              // Timeout after 2 s
              dispatch_after(dispatch_time(DISPATCH_TIME_NOW, 2*NSEC_PER_SEC), q, ^{
                  if (!fired) { fired = YES; nw_connection_cancel(conn);
                      dispatch_async(dispatch_get_main_queue(), ^{ completion(NO); }); }
              });
          }

          - (void)importPairingFileAtURL:(NSURL *)url {
              NSData *data = [NSData dataWithContentsOfURL:url];
              if (!data) return;
              NSString *dest = [self _pairingFilePath];
              [data writeToFile:dest atomically:YES];
          }

          - (NSString *)_pairingFilePath {
              NSString *docs = NSSearchPathForDirectoriesInDomains(
                  NSDocumentDirectory, NSUserDomainMask, YES).firstObject;
              return [docs stringByAppendingPathComponent:@"airlift_pairing.plist"];
          }

          - (BOOL)writeFile:(NSString *)remotePath data:(NSData *)data {
              if (self.activeTransport == VioletTransportAirlift && self.airliftSession) {
                  int r = airlift_write_file(self.airliftSession,
                                             remotePath.UTF8String,
                                             (const uint8_t *)data.bytes,
                                             data.length);
                  return r == 0;
              }
              // BQ / worse_query path — write via group container
              if (self.activeTransport == VioletTransportBQ) {
                  NSURL *grp = [[NSFileManager defaultManager]
                                containerURLForSecurityApplicationGroupIdentifier:@"group.violet.wq"];
                  if (!grp) return NO;
                  NSURL *dest = [grp URLByAppendingPathComponent:
                                 [remotePath lastPathComponent]];
                  return [data writeToURL:dest atomically:YES];
              }
              return NO;
          }

          - (NSData *)readFile:(NSString *)remotePath {
              if (self.activeTransport == VioletTransportAirlift && self.airliftSession) {
                  uint8_t *buf = NULL;
                  size_t   len = 0;
                  int r = airlift_read_file(self.airliftSession,
                                            remotePath.UTF8String, &buf, &len);
                  if (r != 0 || !buf) return nil;
                  NSData *data = [NSData dataWithBytes:buf length:len];
                  airlift_free_buf(buf);
                  return data;
              }
              return nil;
          }

          - (void)dealloc {
              if (_airliftSession) {
                  airlift_session_free(_airliftSession);
                  _airliftSession = NULL;
              }
          }

          @end
          """)

