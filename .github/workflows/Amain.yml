              lbl.textAlignment = NSTextAlignmentCenter;
              lbl.numberOfLines = 0;
              lbl.translatesAutoresizingMaskIntoConstraints = NO;
              [overlay.contentView addSubview:lbl];
              [NSLayoutConstraint activateConstraints:@[
                  [lbl.centerXAnchor constraintEqualToAnchor:overlay.contentView.centerXAnchor],
                  [lbl.centerYAnchor constraintEqualToAnchor:overlay.contentView.centerYAnchor],
                  [lbl.widthAnchor   constraintEqualToAnchor:overlay.contentView.widthAnchor
                                                  multiplier:0.8],
