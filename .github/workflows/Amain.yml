name: Build Violet IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60

    steps:

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Select Xcode 16.4
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer

      - name: Clone AirCard-iOS and extract AirliftFFI
        run: |
          git clone --depth 1 https://github.com/Mak5er/AirCard-iOS.git /tmp/AirCard-iOS
          XCFW=""
          for c in "/tmp/AirCard-iOS/AirliftFFI.xcframework" \
                   "/tmp/AirCard-iOS/Frameworks/AirliftFFI.xcframework" \
                   "/tmp/AirCard-iOS/libs/AirliftFFI.xcframework"; do
            [ -d "$c" ] && XCFW="$c" && break
          done
          [ -z "$XCFW" ] && XCFW=$(find /tmp/AirCard-iOS -name "AirliftFFI.xcframework" -maxdepth 6 | head -1)
          if [ -z "$XCFW" ]; then
            echo "ERROR: AirliftFFI.xcframework not found"
            find /tmp/AirCard-iOS -type d | head -40
            exit 1
          fi
          mkdir -p Frameworks
          cp -R "$XCFW" Frameworks/AirliftFFI.xcframework
          echo "Copied AirliftFFI from: $XCFW"

      - name: Generate Violet source files
        run: python3 scripts/gen_sources.py

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          python3 - << 'EOF'
          content = """name: Violet
          options:
            bundleIdPrefix: com.violet
            deploymentTarget:
              iOS: "18.0"
            xcodeVersion: "16.4"
            createIntermediateGroups: true
          settings:
            base:
              CODE_SIGNING_ALLOWED: "NO"
              CODE_SIGN_IDENTITY: ""
              CODE_SIGNING_REQUIRED: "NO"
              PRODUCT_BUNDLE_IDENTIFIER: com.violet.app
              INFOPLIST_FILE: Violet/App/Info.plist
              ALWAYS_SEARCH_USER_PATHS: "NO"
              CLANG_ENABLE_MODULES: "YES"
              FRAMEWORK_SEARCH_PATHS: "$(SRCROOT)/Frameworks"
              OTHER_LDFLAGS: "-lc++ -framework Network -framework XPC"
          targets:
            Violet:
              type: application
              platform: iOS
              deploymentTarget: "18.0"
              sources:
                - path: Violet
                  excludes:
                    - "**/*.md"
              entitlements:
                path: Violet/App/Violet.entitlements
              settings:
                base:
                  CODE_SIGNING_ALLOWED: "NO"
                  CODE_SIGN_IDENTITY: ""
                  CODE_SIGNING_REQUIRED: "NO"
                  PRODUCT_BUNDLE_IDENTIFIER: com.violet.app
                  INFOPLIST_FILE: Violet/App/Info.plist
                  FRAMEWORK_SEARCH_PATHS: "$(SRCROOT)/Frameworks"
                  OTHER_LDFLAGS: "-lc++ -framework Network -framework XPC"
              dependencies:
                - framework: Frameworks/AirliftFFI.xcframework
                  embed: false
          """
          import textwrap
          open("project.yml","w").write(textwrap.dedent(content))
          print("project.yml written")
          EOF
          xcodegen generate

      - name: Build attempt 1
        id: build1
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild \
            -project Violet.xcodeproj \
            -scheme Violet \
            -configuration Release \
            -sdk iphoneos \
            -arch arm64 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            ONLY_ACTIVE_ARCH=NO \
            build 2>&1 | tee build_attempt1.log

      - name: Auto-fix compile errors
        if: steps.build1.outcome == 'failure'
        run: python3 scripts/autofix.py

      - name: Build attempt 2
        id: build2
        if: steps.build1.outcome == 'failure'
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild \
            -project Violet.xcodeproj \
            -scheme Violet \
            -configuration Release \
            -sdk iphoneos \
            -arch arm64 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            ONLY_ACTIVE_ARCH=NO \
            build 2>&1 | tee build_attempt2.log

      - name: Package unsigned IPA
        run: |
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData \
            -name "Violet.app" -path "*/Release-iphoneos/*" 2>/dev/null | head -1)
          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "ERROR: Violet.app not found — build failed"
            exit 1
          fi
          echo "Packaging: $APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r Violet-unsigned.ipa Payload
          rm -rf Payload
          echo "IPA ready: Violet-unsigned.ipa"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Violet-unsigned-ipa
          path: Violet-unsigned.ipa
          if-no-files-found: error

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build_attempt1.log
            build_attempt2.log
          if-no-files-found: ignore
