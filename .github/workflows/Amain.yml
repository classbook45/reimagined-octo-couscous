          # ── UI/Tabs/TerminalViewController.m ─────────────────────────────
          w("Violet/UI/Tabs/TerminalViewController.m", """\
          #import "TerminalViewController.h"

          @implementation TerminalViewController

          - (void)viewDidLoad {
              [super viewDidLoad];
              self.title = @"Terminal";
              self.view.backgroundColor =
