name: port-all

on:
  workflow_dispatch:
    inputs:
      package_version:
        description: "Full packageVersion"
        default: "1.45.3_30054"
        required: true
      cordl_range:
        description: "bs-cordl range"
        default: "^4503.0.0"
        required: true
      cjd_url:
        description: "CustomJSONData repo"
        default: "https://github.com/bsq-ports/CustomJSONData"
        required: true
      cjd_branch:
        description: "CustomJSONData branch"
        default: "main"
        required: true
      tracks_url:
        description: "Tracks repo"
        default: "https://github.com/bsq-ports/Tracks"
        required: true
      tracks_branch:
        description: "Tracks branch"
        default: "master"
        required: true
      chroma_url:
        description: "Chroma repo"
        default: "https://github.com/bsq-ports/Chroma"
        required: true
      chroma_branch:
        description: "Chroma branch"
        default: "main"
        required: true
      noodle_url:
        description: "NoodleExtensions repo"
        default: "https://github.com/bsq-ports/NoodleExtensions"
        required: true
      noodle_branch:
        description: "NoodleExtensions branch"
        default: "master"
        required: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  port:
    runs-on: ubuntu-latest
    timeout-minutes: 150

    env:
      PACKAGE_VERSION: ${{ inputs.package_version }}
      CORDL_RANGE: ${{ inputs.cordl_range }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK tools
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform-tools and NDK 29
        run: |
          sdkmanager --install "platform-tools" "ndk;29.0.14206865"

          NDK_PATH="$ANDROID_SDK_ROOT/ndk/29.0.14206865"
          test -f "$NDK_PATH/source.properties"

          {
            echo "ANDROID_NDK_HOME=$NDK_PATH"
            echo "ANDROID_NDK_ROOT=$NDK_PATH"
            echo "ANDROID_NDK_LATEST_HOME=$NDK_PATH"
          } >> "$GITHUB_ENV"

          grep "Pkg.Revision" "$NDK_PATH/source.properties"

      - name: Install QPM
        run: |
          python -m pip install --upgrade pip

          curl -fsSL \
            -o qpm.zip \
            https://github.com/QuestPackageManager/QPM.CLI/releases/latest/download/qpm-linux-x64.zip

          unzip -o qpm.zip -d /tmp/qpm

          QPM_BIN="$(find /tmp/qpm -type f -name qpm -print -quit)"

          if [ -z "$QPM_BIN" ]; then
            echo "QPM binary not found"
            exit 1
          fi

          sudo install -m 755 "$QPM_BIN" /usr/local/bin/qpm

          qpm --version

      - name: Verify build environment
        run: |
          echo "Android SDK: $ANDROID_SDK_ROOT"
          echo "Android NDK: $ANDROID_NDK_HOME"
          echo "Java:"
          java -version
          echo "NDK version:"
          grep "Pkg.Revision" "$ANDROID_NDK_HOME/source.properties"
          echo "QPM:"
          qpm --version

      - name: Create port script
        run: |
          cat > port_all.py << 'PYTHON_SCRIPT'
          #!/usr/bin/env python3

          import json
          import os
          import re
          import shutil
          import subprocess
          import sys

          from pathlib import Path
          from datetime import datetime, timezone

          ROOT = Path.cwd()
          SRC = ROOT / "src"
          ARTIFACTS = ROOT / "artifacts"

          SRC.mkdir(exist_ok=True)
          ARTIFACTS.mkdir(exist_ok=True)

          PACKAGE_VERSION = os.environ.get(
              "PACKAGE_VERSION", "1.45.3_30054"
          )

          CORDL_RANGE = os.environ.get(
              "CORDL_RANGE", "^4503.0.0"
          )

          NDK_RANGE = "^29.0.0"

          DEP_RANGES = {
              "bs-cordl": CORDL_RANGE,
              "beatsaber-hook": "^9.0.0",
              "custom-types": "^0.21.2",
              "config-utils": "^3.0.0",
              "bsml": "^0.4.54",
              "songcore": "^1.1.23",
              "paper2_scotland2": "^4.6.4",
              "scotland2": "^0.1.6",
          }

          MODS = [
              {
                  "name": "customjsondata",
                  "id": "custom-json-data",
                  "url": os.environ["CJD_URL"],
                  "branch": os.environ["CJD_BRANCH"],
              },
              {
                  "name": "tracks",
                  "id": "tracks",
                  "url": os.environ["TRACKS_URL"],
                  "branch": os.environ["TRACKS_BRANCH"],
              },
              {
                  "name": "chroma",
                  "id": "chroma",
                  "url": os.environ["CHROMA_URL"],
                  "branch": os.environ["CHROMA_BRANCH"],
              },
              {
                  "name": "noodle",
                  "id": "NoodleExtensions",
                  "url": os.environ["NOODLE_URL"],
                  "branch": os.environ["NOODLE_BRANCH"],
              },
          ]

          built_locals = {}
          results = []

          def run(cmd, cwd=None):
              print(f"\n$ {' '.join(map(str, cmd))}")

              p = subprocess.run(
                  cmd,
                  cwd=cwd,
                  text=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
              )

              output = p.stdout or ""

              print(output[-6000:])

              return p, output

          def load(path):
              with open(path) as f:
                  return json.load(f)

          def save(path, data):
              with open(path, "w") as f:
                  json.dump(data, f, indent=2)
                  f.write("\n")

          def bump_version(version):
              if "+" in version:
                  base, meta = version.split("+", 1)
              else:
                  base, meta = version, ""

              parts = base.split(".")

              try:
                  parts[-1] = str(int(parts[-1]) + 1)
              except ValueError:
                  parts.append("1")

              new = ".".join(parts)

              if meta:
                  new += "+" + meta

              return new

          def patch_repo(repo, notes):
              qpm = repo / "qpm.json"

              if not qpm.exists():
                  notes.append("No qpm.json found")
                  return

              data = load(qpm)

              info = data.setdefault("info", {})

              old_ver = info.get("version", "0.0.0")
              new_ver = bump_version(old_ver)

              info["version"] = new_ver

              notes.append(
                  f"Version: {old_ver} -> {new_ver}"
              )

              for dep in data.get("dependencies", []):
                  dep_id = dep.get("id")

                  if not dep_id:
                      continue

                  if dep_id in DEP_RANGES:
                      wanted = DEP_RANGES[dep_id]

                      if dep.get("versionRange") != wanted:
                          notes.append(
                              f"{dep_id}: {dep.get('versionRange')} -> {wanted}"
                          )

                          dep["versionRange"] = wanted

                  if dep_id in built_locals:
                      local_path = built_locals[dep_id]

                      additional = dep.setdefault(
                          "additionalData", {}
                      )

                      additional["localPath"] = str(local_path)
                      dep["versionRange"] = "*"

                      notes.append(
                          f"{dep_id}: local dependency -> {local_path}"
                      )

              workspace = data.setdefault("workspace", {})

              if workspace.get("ndk") != NDK_RANGE:
                  notes.append(
                      f"NDK: {workspace.get('ndk')} -> {NDK_RANGE}"
                  )

                  workspace["ndk"] = NDK_RANGE

              save(qpm, data)

              cmake_file = repo / "CMakeLists.txt"
              if cmake_file.exists():
                  cmake_text = cmake_file.read_text()
                  original_cmake = cmake_text

                  cmake_text = re.sub(
                      r"(?m)^(\s*set\(CMAKE_CXX_STANDARD)\s+\d+(\s*\))",
                      r"\g<1> 23\2",
                      cmake_text,
                  )
                  cmake_text = re.sub(
                      r"(?m)^(\s*set\(CMAKE_CXX_STANDARD_REQUIRED)\s+[^)\s]+(\s*\))",
                      r"\g<1> ON\2",
                      cmake_text,
                  )

                  if "CMAKE_CXX_STANDARD" not in cmake_text:
                      cmake_text, inserted = re.subn(
                          r"(?m)^(project\([^\n]+\)\s*)$",
                          r"\1\n\nset(CMAKE_CXX_STANDARD 23)\nset(CMAKE_CXX_STANDARD_REQUIRED ON)",
                          cmake_text,
                          count=1,
                      )

                  if cmake_text != original_cmake:
                      cmake_file.write_text(cmake_text)
                      notes.append("CMake C++ standard set to C++23")

              build_script = repo / "scripts" / "build.ps1"
              if build_script.exists():
                  script_text = build_script.read_text()
                  original_script = script_text

                  script_text = re.sub(
                      r"(?m)^(& cmake -G .* -B build)\s*$",
                      r"\1\nif ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }",
                      script_text,
                  )
                  script_text = re.sub(
                      r"(?m)^(& cmake --build ./build)\s*$",
                      r"\1\nif ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }",
                      script_text,
                  )

                  if script_text != original_script:
                      build_script.write_text(script_text)
                      notes.append("PowerShell build script now propagates CMake failures")

          def cluster_errors(log):
              errors = []
              seen = set()

              for line in log.splitlines():
                  if "error:" in line.lower() or "fatal error:" in line.lower():
                      key = re.sub(r":\d+:\d+", ":X:Y", line)

                      if key not in seen:
                          seen.add(key)
                          errors.append(line.strip())

              return errors[:30]

          def build_one(mod):
              name = mod["name"]
              mod_id = mod["id"]

              print("\n" + "=" * 60)
              print(f"BUILDING: {name}")
              print("=" * 60)

              result = {
                  "name": name,
                  "id": mod_id,
                  "success": False,
                  "stage": "clone",
                  "notes": [],
                  "errors": [],
                  "log_tail": "",
              }

              repo = SRC / name

              if repo.exists():
                  shutil.rmtree(repo)

              p, output = run([
                  "git",
                  "clone",
                  "--depth",
                  "1",
                  "--branch",
                  mod["branch"],
                  mod["url"],
                  str(repo),
              ])

              if p.returncode != 0:
                  result["errors"] = ["Git clone failed"]
                  result["log_tail"] = output[-4000:]
                  return result

              notes = []
              patch_repo(repo, notes)

              result["notes"] = notes

              print("\nRestoring dependencies...")

              p, output = run(
                  ["qpm", "restore"],
                  cwd=repo,
              )

              if p.returncode != 0:
                  result["stage"] = "restore"
                  result["errors"] = cluster_errors(output)

                  if not result["errors"]:
                      result["errors"] = [
                          "Dependency resolution failed"
                      ]

                  result["log_tail"] = output[-5000:]
                  return result

              print("\nBuilding...")

              p, output = run(
                  ["qpm", "s", "build"],
                  cwd=repo,
              )

              if p.returncode != 0:
                  result["stage"] = "build"
                  result["errors"] = cluster_errors(output)
                  result["log_tail"] = output[-5000:]

                  if not result["errors"]:
                      result["errors"] = ["Build failed"]

                  return result

              print("\nPackaging QMOD...")

              p, output = run(
                  ["qpm", "qmod", "zip"],
                  cwd=repo,
              )

              if p.returncode != 0:
                  result["stage"] = "package"
                  result["errors"] = ["QMOD packaging failed"]
                  result["log_tail"] = output[-4000:]
                  return result

              qmods = list(repo.rglob("*.qmod"))

              if not qmods:
                  result["stage"] = "package"
                  result["errors"] = ["No QMOD artifact generated"]
                  return result

              for qmod in qmods:
                  destination = ARTIFACTS / qmod.name
                  shutil.copy2(qmod, destination)

                  print(f"Artifact: {destination}")

              built_locals[mod_id] = repo.resolve()

              result["success"] = True
              result["stage"] = "done"

              print(f"\nSUCCESS: {name}")

              return result

          def main():
              print("Beat Saber port pipeline")
              print(f"Game version: {PACKAGE_VERSION}")
              print(f"CORDL: {CORDL_RANGE}")
              print(f"NDK: {NDK_RANGE}")

              for mod in MODS:
                  result = build_one(mod)
                  results.append(result)

                  if not result["success"]:
                      print(
                          f"\n{mod['name']} failed at {result['stage']}"
                      )

                      if mod["name"] == "customjsondata":
                          print(
                              "CustomJSONData failed. "
                              "Stopping dependent builds."
                          )
                          break

              print("\n" + "=" * 60)
              print("BUILD SUMMARY")
              print("=" * 60)

              for result in results:
                  status = (
                      "SUCCESS"
                      if result["success"]
                      else f"FAILED ({result['stage']})"
                  )

                  print(f"{result['name']:20} {status}")

                  for error in result["errors"]:
                      print(f"  ERROR: {error}")

              summary = ARTIFACTS / "port-summary.txt"

              with open(summary, "w") as f:
                  f.write(
                      "Port run: "
                      + datetime.now(timezone.utc).isoformat()
                      + "\n"
                  )

                  f.write(
                      f"Game version: {PACKAGE_VERSION}\n"
                  )

                  f.write(f"NDK range: {NDK_RANGE}\n\n")

                  for result in results:
                      f.write(
                          f"### {result['name']} ({result['id']})\n"
                      )

                      f.write(
                          f"Success: {result['success']}\n"
                      )

                      f.write(
                          f"Stage: {result['stage']}\n"
                      )

                      for note in result["notes"]:
                          f.write(f"NOTE: {note}\n")

                      for error in result["errors"]:
                          f.write(f"ERROR: {error}\n")

                      f.write(
                          result["log_tail"] + "\n\n"
                      )

              if any(not r["success"] for r in results):
                  sys.exit(1)

          if __name__ == "__main__":
              main()
          PYTHON_SCRIPT

      - name: Run port
        env:
          CJD_URL: ${{ inputs.cjd_url }}
          CJD_BRANCH: ${{ inputs.cjd_branch }}
          TRACKS_URL: ${{ inputs.tracks_url }}
          TRACKS_BRANCH: ${{ inputs.tracks_branch }}
          CHROMA_URL: ${{ inputs.chroma_url }}
          CHROMA_BRANCH: ${{ inputs.chroma_branch }}
          NOODLE_URL: ${{ inputs.noodle_url }}
          NOODLE_BRANCH: ${{ inputs.noodle_branch }}
        run: python3 port_all.py

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ported-mods
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 14
