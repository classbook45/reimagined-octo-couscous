name: VR Beat Saver — Operation Beat Saver (Noodle Fix)

on:
  workflow_call:
    inputs:
      package_version:
        type: string
        required: false
        default: "1.45.3_30054"
      cordl_range:
        type: string
        required: false
        default: "^4503.0.0"
      hook_range:
        type: string
        required: false
        default: "^9.3.0"
  push:
    branches: [main]
    paths:
      - '.github/workflows/vr-beat-saver.yml'
      - '.github/operation-beat-saver/patches/**'
      - '.github/operation-beat-saver/scripts/**'
  workflow_dispatch:
    inputs:
      package_version:
        description: "Beat Saber package version"
        required: true
        default: "1.45.3_30054"
      cordl_range:
        description: "Target bs-cordl range"
        required: true
        default: "^4503.0.0"
      hook_range:
        description: "Target beatsaber-hook range"
        required: true
        default: "^9.3.0"

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  operation-beat-saver:
    name: Inspect, patch and build Quest mods
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PACKAGE_VERSION: ${{ inputs.package_version || '1.45.3_30054' }}
      CORDL_RANGE: ${{ inputs.cordl_range || '^4503.0.0' }}
      HOOK_RANGE: ${{ inputs.hook_range || '^9.3.0' }}
      ANDROID_NDK_VERSION: "29.0.14206865"

    steps:
      - name: Checkout workflow and compatibility patches
        uses: actions/checkout@v4

      - name: Set up Python and Java
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare CustomModels-only build directories
        run: |
          set -euo pipefail
          mkdir -p artifacts reports

      - name: Clone pinned CustomModels source into Operation Beat Saver
        env:
          CUSTOMMODELS_REVISION: "28c049c2d24e0d9a0172d42db07ec80e72a3d62d"
        run: |
          set -euo pipefail
          git clone https://github.com/Metalit/CustomModels.git CustomModels
          git -C CustomModels checkout --detach "$CUSTOMMODELS_REVISION"
          git -C CustomModels submodule update --init --recursive
          test "$(git -C CustomModels rev-parse HEAD)" = "$CUSTOMMODELS_REVISION"
          echo "CustomModels source pinned at $CUSTOMMODELS_REVISION"

      - name: Prepare CustomModels native build tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build build-essential binutils
          cmake --version
          ninja --version
          readelf --version
          pwsh --version

      - name: Align only the Beat Saber toolchain and refresh dependency lock
        working-directory: CustomModels
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path

          qpm_path = Path("qpm.json")
          shared_path = Path("qpm.shared.json")
          qpm = json.loads(qpm_path.read_text())
          shared = json.loads(shared_path.read_text())

          def align(config):
              config.setdefault("workspace", {})["ndk"] = "^29.0.0"
              target_ranges = {
                  "beatsaber-hook": os.environ["HOOK_RANGE"],
                  "bs-cordl": os.environ["CORDL_RANGE"],
                  # The 1.45.3 mod catalog requires MetaCore 2.0.6.
                  # CustomModels' upstream lockfile still pins MetaCore 1.4.0,
                  # which cannot coexist with the installed core-mod graph.
                  "metacore": "^2.0.6",
                  "custom-types": "^0.21.2",
                  # Lapiz 0.3.7 is the current line for Hook 9 / Cordl 4503
                  # and supports CustomTypes 0.21.x (unlike Lapiz 0.2.x).
                  "lapiz": "^0.3.7",
                  "paper2_scotland2": "^4.8.0",
                  # rapidjson-macros 2.1.0 requires Hook 6.x; v3.0.0 is
                  # the compatible release used by current Hook 9.3 projects.
                  "rapidjson-macros": "^3.0.0",
                  # config-utils 2.x requires Hook 7.x and RapidJSON macros
                  # 2.x; use the verified 3.0.0 line for Hook 9 projects.
                  "config-utils": "^3.0.0",
                  # BSML 0.4.x hard-pins CustomTypes 0.18.x; 0.6.7
                  # supports the 0.21.x API used by this Beat Saber target.
                  "bsml": "^0.6.7",
              }
              for dep in config.get("dependencies", []):
                  dep_id = dep.get("id")
                  if dep_id in target_ranges:
                      dep["versionRange"] = target_ranges[dep_id]

              # MetaCore 2 split Beat Saber game-state headers into MetaCoreBS.
              # CustomModels still uses Game and Internals APIs from that package.
              if not any(dep.get("id") == "metacore-bs" for dep in config.get("dependencies", [])):
                  config.setdefault("dependencies", []).append({
                      "id": "metacore-bs",
                      "versionRange": "^1.0.1",
                      "additionalData": {},
                  })

          align(qpm)
          align(shared["config"])

          # Refresh the complete dependency graph so the generated QMOD no
          # longer carries the incompatible MetaCore 1.4.0 dependency lock.
          qpm_path.write_text(json.dumps(qpm, indent=2) + "\n")
          shared_path.write_text(json.dumps(shared, indent=2) + "\n")

          template = json.loads(Path("mod.template.json").read_text())
          template["packageVersion"] = os.environ["PACKAGE_VERSION"]
          Path("mod.template.json").write_text(json.dumps(template, indent=2) + "\n")
          PY
          qpm ndk resolve -d
          qpm restore --update

      - name: Verify resolved dependencies and normalize the zip library input
        working-directory: CustomModels
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, re
          from pathlib import Path

          shared = json.loads(Path("qpm.shared.json").read_text())
          resolved = {
              item.get("dependency", {}).get("id"): item.get("version", "")
              for item in shared.get("restoredDependencies", [])
          }
          minimums = {
              "beatsaber-hook": "9.3.0",
              "bs-cordl": "4503.0.0",
              "metacore": "2.0.6",
              "metacore-bs": "1.0.1",
              "custom-types": "0.21.2",
              "lapiz": "0.3.7",
              "rapidjson-macros": "3.0.0",
              "config-utils": "3.0.0",
              "bsml": "0.6.7",
              "paper2_scotland2": "4.8.0",
          }

          def version_tuple(value):
              match = re.match(r"^(\d+)\.(\d+)\.(\d+)", value or "")
              return tuple(map(int, match.groups())) if match else None

          failures = []
          for dep_id, minimum in minimums.items():
              actual = resolved.get(dep_id, "")
              actual_tuple = version_tuple(actual)
              minimum_tuple = version_tuple(minimum)
              print(f"{dep_id}: {actual or 'MISSING'} (minimum {minimum})")
              if actual_tuple is None or actual_tuple < minimum_tuple:
                  failures.append(f"{dep_id}: expected >= {minimum}, resolved {actual or 'missing'}")
          if failures:
              raise SystemExit("Dependency graph is not aligned:\n" + "\n".join(failures))
          PY

          # CustomModels' CMakeLists.txt still consumes this legacy filename
          # during its post-build step. The pinned QPM zip package only
          # publishes the regular libzip.so, not a separate debugSoLink.
          if [[ ! -s extern/libs/libzip.so ]]; then
            if [[ -s extern/libs/libzip.so.so ]]; then
              cp extern/libs/libzip.so.so extern/libs/libzip.so
            else
              echo "QPM did not restore extern/libs/libzip.so"
              find extern/libs -maxdepth 1 -type f -printf '%f\n' | sort || true
              exit 1
            fi
          fi
          cp -f extern/libs/libzip.so extern/libs/libzip.debug.so
          test -s extern/libs/libzip.debug.so

      - name: Add missing standard vector include to CustomModels zip header
        working-directory: CustomModels
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path("include/zip.hpp")
          data = path.read_text()
          missing = [header for header in ("vector", "utility") if f"#include <{header}>" not in data]
          if missing:
              anchor = "#include <string>"
              if data.count(anchor) != 1:
                  raise SystemExit("Expected exactly one <string> include in include/zip.hpp")
              addition = "".join(f"\n#include <{header}>" for header in missing)
              path.write_text(data.replace(anchor, anchor + addition, 1))
              print("Added required standard headers: " + ", ".join(missing))
          else:
              print("zip.hpp already includes vector and utility")
          PY

      - name: Verify resolved headers without stale source rewrites
        working-directory: CustomModels
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          cache = Path.home() / ".local/share/QPM-RS/cache"
          print("Project headers:")
          for root in (Path("include"), Path("extern"), cache):
              if root.exists():
                  for name in ("il2cpp-utils-methods.hpp", "typedefs-list.hpp", "RegistrationHelper.hpp"):
                      hits = list(root.rglob(name))
                      for hit in hits[:10]:
                          print(hit)
          print("Proceeding with the resolved Hook 9 / Cordl 4503 headers as published.")
          PY

      - name: Enable C++23 required by Hook 9.3
        working-directory: CustomModels
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path("CMakeLists.txt")
          source = path.read_text()
          pattern = r"(?m)^set\(CMAKE_CXX_STANDARD 20\)\r?\nset\(CMAKE_CXX_STANDARD_REQUIRED 20\)$"
          updated, count = re.subn(pattern, "set(CMAKE_CXX_STANDARD 23)\nset(CMAKE_CXX_STANDARD_REQUIRED ON)", source)
          if count != 1:
              raise SystemExit(f"Expected one C++20 declaration pair; found {count}")
          path.write_text(updated)
          print("Updated CustomModels to C++23 for Hook 9.3 std::expected APIs")
          PY
          grep -n "CMAKE_CXX_STANDARD" CMakeLists.txt

      - name: Migrate Hook 9 header locations used by CustomModels
        working-directory: CustomModels
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              'beatsaber-hook/shared/utils/hooking.hpp': 'beatsaber-hook/shared/hooking.hpp',
              'beatsaber-hook/shared/utils/logging.hpp': 'beatsaber-hook/shared/utils.hpp',
          }
          changed = []
          for root in (Path("include"), Path("src")):
              for path in root.rglob("*"):
                  if not path.is_file() or path.suffix not in {".h", ".hpp", ".cpp"}:
                      continue
                  source = path.read_text()
                  updated = source
                  for old, new in replacements.items():
                      updated = updated.replace(old, new)
                  if updated != source:
                      path.write_text(updated)
                      changed.append(str(path))
          if not changed:
              raise SystemExit("Expected legacy Hook header includes were not found; refusing a no-op migration")
          print("Migrated Hook 9 header locations in:")
          print("\n".join(changed))
          PY

      - name: Port CustomModels source APIs to Beat Saber 1.45.3
        working-directory: CustomModels
        run: |
          set -euo pipefail
          python3 ../.github/operation-beat-saver/scripts/port_custommodels_1453.py
          git diff --check
          git diff --stat

      - name: Link reflect-cpp and include Cordl IList implementation
        working-directory: CustomModels
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          # QPM resolves reflect-cpp transitively through ConfigUtils 3, but its
          # package metadata does not mark the shared library for CMake linking.
          # Ensure the resolved Android binary is available to this target.
          library = Path("extern/libs/libreflectcpp.so")
          if not library.is_file() or library.stat().st_size == 0:
              cache = Path.home() / ".local/share/QPM-RS/cache/reflectcpp/0.25.0"
              matches = list(cache.rglob("libreflectcpp.so"))
              if len(matches) != 1 or matches[0].stat().st_size == 0:
                  raise SystemExit(f"Expected one cached reflectcpp 0.25.0 shared library, found {matches}")
              library.parent.mkdir(parents=True, exist_ok=True)
              library.write_bytes(matches[0].read_bytes())

          cmake = Path("CMakeLists.txt")
          source = cmake.read_text()
          anchor = "include(extern.cmake)"
          link = 'target_link_libraries(\u0024{COMPILE_ID} PRIVATE "\u0024{CMAKE_CURRENT_SOURCE_DIR}/extern/libs/libreflectcpp.so")'
          if source.count(anchor) != 1:
              raise SystemExit("Expected exactly one include(extern.cmake) in CMakeLists.txt")
          if link not in source:
              source = source.replace(anchor, anchor + "\n\n# ConfigUtils 3 uses reflect-cpp; link its QPM-restored implementation explicitly.\n" + link, 1)
              cmake.write_text(source)

          defaults = Path("src/defaults.cpp")
          source = defaults.read_text()
          anchor = '#include "BGLib/UnityExtension/AddressablesExtensions.hpp"'
          include = '#include "System/Collections/Generic/zzzz__IList_1_impl.hpp"'
          if source.count(anchor) != 1:
              raise SystemExit("defaults.cpp no longer matches the pinned Addressables include layout")
          if include not in source:
              source = source.replace(anchor, anchor + "\n" + include, 1)
              defaults.write_text(source)
          print("Explicit reflect-cpp link and Cordl IList_1 template implementation are installed.")
          PY
          test -s extern/libs/libreflectcpp.so
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm" -D --defined-only extern/libs/libreflectcpp.so > /tmp/reflectcpp.symbols
          c++filt < /tmp/reflectcpp.symbols > /tmp/reflectcpp.demangled
          grep -q 'rfl::json::Writer::Writer()' /tmp/reflectcpp.demangled
          grep -q 'yyjson_read_opts' /tmp/reflectcpp.symbols
          grep -n 'libreflectcpp.so' CMakeLists.txt
          grep -n 'zzzz__IList_1_impl.hpp' src/defaults.cpp

      - name: Build CustomModels native library with bounded auto-fixes
        working-directory: CustomModels
        run: |
          set -euo pipefail
          test -f qpm_defines.cmake
          rm -rf build
          cmake -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DHOT_RELOAD=OFF -B build .
          python3 ../.github/operation-beat-saver/scripts/autofix_custommodels_build.py
          LIBRARY="$(find build -type f -name 'libcustommodels.so' -print -quit)"
          test -n "$LIBRARY"
          file "$LIBRARY"
          readelf -h "$LIBRARY" | grep -E 'Class:|Machine:'

      - name: Create and validate CustomModels QMOD
        working-directory: CustomModels
        run: |
          set -euo pipefail
          pwsh ./scripts/createqmod.ps1 -QmodName CustomModels
          python3 - <<'PY'
          import pathlib, struct, zipfile
          path = pathlib.Path("CustomModels.qmod")
          if not path.is_file():
              raise SystemExit("CustomModels.qmod was not created")
          with zipfile.ZipFile(path) as archive:
              names = archive.namelist()
              libs = [archive.read(name) for name in names if name.endswith("libcustommodels.so")]
          if not libs:
              raise SystemExit("QMOD does not contain libcustommodels.so")
          valid = any(
              len(data) >= 20 and data[:4] == b"\x7fELF" and
              data[4] == 2 and data[5] == 1 and
              struct.unpack("<H", data[18:20])[0] == 183
              for data in libs
          )
          if not valid:
              raise SystemExit("CustomModels QMOD does not contain an ARM64 ELF library")
          print("Validated ARM64 CustomModels QMOD:", path)
          print("QMOD entries:", names)
          PY
          mkdir -p ../artifacts
          cp CustomModels.qmod ../artifacts/


      - name: Upload builds and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: operation-beat-saver-results
          path: |
            artifacts/
            reports/
          if-no-files-found: warn
          retention-days: 14
