name: VR Beat Saver — Operation Beat Saver (Noodle Fix)

on:
  workflow_call:
    inputs:
      package_version:
        type: string
        required: false
        default: "1.45.3_30054"
      cordl_range:
        type: string
        required: false
        default: "^4503.0.0"
      hook_range:
        type: string
        required: false
        default: "^9.3.0"
  push:
    branches: [main]
    paths:
      - '.github/workflows/vr-beat-saver.yml'
      - '.github/operation-beat-saver/patches/**'
  workflow_dispatch:
    inputs:
      package_version:
        description: "Beat Saber package version"
        required: true
        default: "1.45.3_30054"
      cordl_range:
        description: "Target bs-cordl range"
        required: true
        default: "^4503.0.0"
      hook_range:
        description: "Target beatsaber-hook range"
        required: true
        default: "^9.3.0"

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  operation-beat-saver:
    name: Inspect, patch and build Quest mods
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PACKAGE_VERSION: ${{ inputs.package_version || '1.45.3_30054' }}
      CORDL_RANGE: ${{ inputs.cordl_range || '^4503.0.0' }}
      HOOK_RANGE: ${{ inputs.hook_range || '^9.3.0' }}
      ANDROID_NDK_VERSION: "29.0.14206865"

    steps:
      - name: Checkout workflow and compatibility patches
        uses: actions/checkout@v4

      - name: Set up Python and Java
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Rust nightly and cargo-ndk
        run: |
          rustup toolchain install nightly --profile minimal
          rustup target add aarch64-linux-android --toolchain nightly
          cargo install --locked cargo-ndk
          cargo ndk --version

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build


      - name: Install Android SDK and NDK 29
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install pinned NDK
        run: |
          sdkmanager --install "platform-tools" "ndk;${ANDROID_NDK_VERSION}"
          NDK_PATH="$ANDROID_SDK_ROOT/ndk/$ANDROID_NDK_VERSION"
          test -f "$NDK_PATH/source.properties"
          {
            echo "ANDROID_NDK_HOME=$NDK_PATH"
            echo "ANDROID_NDK_ROOT=$NDK_PATH"
            echo "ANDROID_NDK_LATEST_HOME=$NDK_PATH"
          } >> "$GITHUB_ENV"
          grep "Pkg.Revision" "$NDK_PATH/source.properties"

      - name: Install QPM
        run: |
          curl -fsSL -o qpm.zip https://github.com/QuestPackageManager/QPM.CLI/releases/latest/download/qpm-linux-x64.zip
          unzip -oq qpm.zip -d /tmp/qpm
          QPM_BIN="$(find /tmp/qpm -type f -name qpm -print -quit)"
          test -n "$QPM_BIN"
          sudo install -m 755 "$QPM_BIN" /usr/local/bin/qpm
          qpm --version

      - name: Publish milestone roadmap
        run: |
          mkdir -p reports
          cp .github/operation-beat-saver/MILESTONES.md reports/MILESTONES.md
          cat reports/MILESTONES.md

      - name: Clone, inspect and patch the source projects
        env:
          PORTS_URL: https://github.com/trail-b1az3r/ports-
          PORTS_BRANCH: main
          PORTS_REVISION: c3bcdffbaf90d6c3bc2d70f68fcf6cb2da0341e3
        run: |
          mkdir -p src artifacts reports
          cat > operation.py <<'PY'
          import json, os, pathlib, shutil, struct, subprocess, sys, zipfile

          ROOT = pathlib.Path.cwd()
          SRC = ROOT / "src"
          REPORTS = ROOT / "reports"
          ARTIFACTS = ROOT / "artifacts"
          CORDL = os.environ["CORDL_RANGE"]
          HOOK = os.environ["HOOK_RANGE"]
          NDK = "^29.0.0"

          projects = [
              ("CustomJSONData", "custom-json-data"),
              ("Tracks", "tracks"),
              ("NoodleExtensions", "NoodleExtensions"),
              ("Chroma", "chroma"),
          ]
          local_projects = {}
          summary = []

          def run(args, cwd=None):
              print("\n$ " + " ".join(map(str, args)), flush=True)
              p = subprocess.run(args, cwd=cwd, text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
              print(p.stdout[-12000:], flush=True)
              return p.returncode, p.stdout

          def update_manifest(path, shared=False):
              data = json.loads(path.read_text())
              cfg = data.get("config", data) if shared else data
              deps = cfg.get("dependencies", [])
              edits = []
              for dep in deps:
                  dep_id = dep.get("id")
                  if dep_id == "bs-cordl":
                      dep["versionRange"] = CORDL
                      edits.append(f"bs-cordl => {CORDL}")
                  elif dep_id == "beatsaber-hook":
                      dep["versionRange"] = HOOK
                      edits.append(f"beatsaber-hook => {HOOK}")
                  if dep_id in local_projects:
                      dep.setdefault("additionalData", {})["localPath"] = str(local_projects[dep_id])
                      dep["versionRange"] = "*"
                      edits.append(f"{dep_id} => local build {local_projects[dep_id]}")
              workspace = cfg.setdefault("workspace", {})
              workspace["ndk"] = NDK
              # qpm.shared.json carries a restoredDependencies lock snapshot.
              # Drop it after changing version ranges so QPM cannot silently reuse
              # the old Hook 6.x / CORDL 4008 headers.
              if shared:
                  data["restoredDependencies"] = []
              path.write_text(json.dumps(data, indent=2) + "\n")
              return edits

          def patch_cmake(repo):
              path = repo / "CMakeLists.txt"
              if not path.exists():
                  return []
              # Keep each project's declared language standard. C++23 is not a
              # substitute for migrating code to the new Hook/CORDL interfaces.
              return ["CMake standard preserved: " + next((x.strip() for x in path.read_text().splitlines() if "CMAKE_CXX_STANDARD " in x), "not explicitly declared")]

          ports = ROOT / "ports"
          rc, log = run(["git", "clone", "--depth", "1", "--branch", os.environ["PORTS_BRANCH"], os.environ["PORTS_URL"], str(ports)])
          if rc:
              raise SystemExit("Could not clone the Beat Saber 1.45.3 compatibility ports")
          rc, rev = run(["git", "rev-parse", "HEAD"], cwd=ports)
          print("Using 1.45.3 compatibility source revision: " + rev.strip(), flush=True)
          expected_revision = os.environ["PORTS_REVISION"]
          if rev.strip() != expected_revision:
              raise SystemExit(f"Compatibility source revision mismatch: expected {expected_revision}, got {rev.strip()}")

          for name, mod_id in projects:
              repo = ports / name
              if not repo.is_dir():
                  summary.append({"project": name, "stage": "clone", "success": False, "changes": [], "errors": ["Project directory missing from compatibility ports"]})
                  continue
              rc, log = 0, "Using project source from the pinned 1.45.3 compatibility ports bundle"
              record = {"project": name, "stage": "clone", "success": False, "changes": [], "errors": []}
              if rc:
                  record["errors"].append("Git clone failed")
                  (REPORTS / f"{name}.log").write_text(log)
                  summary.append(record)
                  continue

              # Apply project-specific, reviewed source patches when present.
              patch = ROOT / ".github" / "operation-beat-saver" / "patches" / f"{name}.patch"
              if patch.exists() and patch.stat().st_size:
                  rc, patch_log = run(["git", "apply", "--verbose", f"--directory={name}", str(patch)], cwd=ports)
                  record["changes"].append("Applied repository compatibility patch")
                  if rc:
                      record["stage"] = "source-patch"
                      record["errors"].append("Patch did not apply cleanly; refusing to build unpatched source")
                      (REPORTS / f"{name}.log").write_text(patch_log)
                      summary.append(record)
                      continue
                  if name == "Chroma" and not (repo / "CMakeLists.txt").is_file():
                      record["stage"] = "source-patch"
                      record["errors"].append("Chroma patch reported success but did not create the project-root CMakeLists.txt")
                      (REPORTS / f"{name}.log").write_text(patch_log)
                      summary.append(record)
                      continue
              else:
                  if name == "NoodleExtensions":
                      record["stage"] = "source-patch"
                      record["errors"].append("Required NoodleExtensions crash-fix patch is missing; refusing to build unpatched source")
                      summary.append(record)
                      continue
                  record["changes"].append("Using the dedicated Beat Saber 1.45.3 compatibility source; no extra overlay patch needed")

              qpm = repo / "qpm.json"
              if not qpm.exists():
                  record["stage"] = "inspect"
                  record["errors"].append("Missing qpm.json")
                  summary.append(record)
                  continue

              shared = repo / "qpm.shared.json"
              if not shared.exists():
                  record["stage"] = "inspect"
                  record["errors"].append("Missing qpm.shared.json lockfile for the 1.45.3 port")
                  summary.append(record)
                  continue
              record["changes"].append("Using the port's 1.45.3 source and dependency lockfile; no speculative version rewrites")

              record["stage"] = "dependency-restore"
              rc, ndk_log = run(["qpm", "ndk", "resolve", "-d"], cwd=repo)
              if rc:
                  record["errors"].append("QPM could not resolve the pinned Android NDK")
                  (REPORTS / f"{name}.log").write_text(ndk_log)
                  summary.append(record)
                  continue
              # Some upstream build scripts hard-code scripts/ndkpath.txt,
              # while QPM resolves the NDK path at the project root.
              if name == "Chroma":
                  root_ndk = repo / "ndkpath.txt"
                  if root_ndk.exists():
                      scripts_dir = repo / "scripts"
                      scripts_dir.mkdir(parents=True, exist_ok=True)
                      shutil.copy2(root_ndk, scripts_dir / "ndkpath.txt")
              # QPM's package cache expects the declared sharedDir to exist,
              # even for ports whose source tree only contains include/ headers.
              (repo / "shared").mkdir(parents=True, exist_ok=True)
              rc, restore_log = run(["qpm", "restore"], cwd=repo)
              if rc:
                  record["errors"].append("QPM dependency resolution failed")
                  (REPORTS / f"{name}.log").write_text(restore_log)
                  summary.append(record)
                  continue

              # Verify that the lockfile now contains the requested generation,
              # rather than silently accepting the old 6.x / 4008 headers.
              shared_after_restore = json.loads(shared.read_text()) if shared.exists() else {}
              resolved = {
                  item.get("dependency", {}).get("id"): item.get("version", "")
                  for item in shared_after_restore.get("restoredDependencies", [])
              }
              def version_tuple(value):
                  parts = []
                  for part in value.split("."):
                      digits = "".join(ch for ch in part if ch.isdigit())
                      if not digits:
                          break
                      parts.append(int(digits))
                  return tuple((parts + [0, 0, 0])[:3])
              required = {"beatsaber-hook": (9, 3, 0), "bs-cordl": (4503, 0, 0)}
              bad = []
              for dep_id, minimum in required.items():
                  actual = resolved.get(dep_id, "")
                  if not actual or version_tuple(actual) < minimum:
                      bad.append(f"{dep_id}: expected >= {'.'.join(map(str, minimum))}, resolved {actual or 'missing'}")
              record["changes"].append("Resolved dependency versions: " + ", ".join(f"{k}={v}" for k, v in resolved.items() if k in required))
              if bad:
                  record["stage"] = "dependency-restore"
                  record["errors"].extend(bad)
                  (REPORTS / f"{name}.log").write_text(restore_log + "\n" + "\n".join(bad))
                  summary.append(record)
                  continue

              record["stage"] = "compile"
              if name == "Tracks":
                  rc, build_log = run(["bash", "-lc", 'export RUSTUP_TOOLCHAIN=nightly && export ANDROID_NDK_HOME="$(cat ndkpath.txt)" && qpm s build'], cwd=repo)
              else:
                  rc, build_log = run(["qpm", "s", "build"], cwd=repo)
              if rc:
                  record["errors"] += [line.strip() for line in build_log.splitlines()
                                       if "error:" in line.lower() or "fatal error:" in line.lower()][:40]
                  if not record["errors"]:
                      record["errors"].append("Compiler/build command failed; see full log")
                  (REPORTS / f"{name}.log").write_text(build_log)
                  summary.append(record)
                  continue

              rc, install_log = run(["qpm", "install"], cwd=repo)
              if rc:
                  record["errors"].append("QPM could not install the freshly built package into the runner's local package cache")
                  (REPORTS / f"{name}.log").write_text(install_log)
                  summary.append(record)
                  continue
              record["stage"] = "package"
              rc, package_log = run(["qpm", "qmod", "zip"], cwd=repo)
              if rc:
                  record["errors"].append("QMOD packaging failed")
                  (REPORTS / f"{name}.log").write_text(package_log)
                  summary.append(record)
                  continue

              qmod_name = json.loads(qpm.read_text()).get("workspace", {}).get("qmodOutput")
              qmods = [p for p in repo.rglob(qmod_name)] if qmod_name else []
              if not qmods:
                  record["errors"].append("Build completed but no .qmod was produced")
                  summary.append(record)
                  continue
              for qmod in qmods:
                  target = ARTIFACTS / qmod.name
                  target.write_bytes(qmod.read_bytes())
              local_projects[mod_id] = repo.resolve()
              record["stage"] = "complete"
              record["success"] = True
              summary.append(record)

          (REPORTS / "summary.json").write_text(json.dumps(summary, indent=2) + "\n")
          by_name = {item["project"]: item for item in summary}
          all_projects = len(summary) == len(projects)
          source_inventory = all_projects and all(item["stage"] != "clone" for item in summary)
          dependency_alignment = all_projects and all(item["stage"] in ("compile", "package", "complete") for item in summary)
          source_migration = all_projects and all(item["success"] for item in summary)
          qmods = list(ARTIFACTS.glob("*.qmod"))
          qmod_count = len(qmods)
          def is_arm64_qmod(path):
              try:
                  with zipfile.ZipFile(path) as archive:
                      for name in archive.namelist():
                          if name.endswith(".so"):
                              data = archive.read(name)
                              if len(data) >= 20 and data[:4] == b"\x7fELF" and data[4] == 2 and data[5] == 1 and struct.unpack("<H", data[18:20])[0] == 183:
                                  return True
              except (zipfile.BadZipFile, OSError):
                  return False
              return False
          validated_qmods = sum(1 for qmod in qmods if is_arm64_qmod(qmod))
          all_built = all_projects and all(item["success"] for item in summary)
          milestone_checks = [
              ("1. Workflow and toolchain baseline", pathlib.Path(os.environ["ANDROID_NDK_HOME"], "source.properties").exists() and shutil.which("qpm") is not None),
              ("2. Source inventory", source_inventory),
              ("3. Dependency graph alignment", dependency_alignment),
              ("4. Source/API migration", source_migration),
              ("5. CustomJSONData build", by_name.get("CustomJSONData", {}).get("success", False)),
              ("6. Tracks build", by_name.get("Tracks", {}).get("success", False)),
              ("7. Chroma build", by_name.get("Chroma", {}).get("success", False)),
              ("8. NoodleExtensions build", by_name.get("NoodleExtensions", {}).get("success", False)),
              ("9. QMOD package validation", all_built and qmod_count >= 4 and validated_qmods >= 4),
              ("10. Release bundle validation", all_built and qmod_count >= 4 and validated_qmods >= 4),
          ]
          reached = sum(1 for _, ok in milestone_checks if ok)
          lines = [f"Target Beat Saber package: {os.environ['PACKAGE_VERSION']}",
                   f"CORDL: {CORDL}", f"Hook: {HOOK}", f"NDK: {os.environ['ANDROID_NDK_VERSION']}", "",
                   f"MILESTONE SCORE: {reached}/{len(milestone_checks)}",
                   f"QMOD files: {qmod_count}; valid AArch64 native payloads: {validated_qmods}"]
          for label, ok in milestone_checks:
              lines.append(f"[{'PASS' if ok else 'PENDING/FAIL'}] {label}")
          lines.append("")
          for item in summary:
              lines.append(f"{item['project']}: {'PASS' if item['success'] else 'FAIL'} at {item['stage']}")
              lines.extend("  CHANGE: " + x for x in item["changes"])
              lines.extend("  ERROR: " + x for x in item["errors"])
          (ARTIFACTS / "operation-beat-saver-report.txt").write_text("\n".join(lines) + "\n")
          print("\n".join(lines))
          if not summary or not all_built or reached != len(milestone_checks):
              sys.exit(1)
          PY
          python3 operation.py

      - name: Build Vivify separately for Beat Saber 1.45.3
        env:
          VIVIFY_REVISION: "76cdcb442d16c3a705809cc03911cde5fe007b17"
          VIVIFY_GAME_TARGET: "1.45.3"
        run: |
          set -euo pipefail
          git clone https://github.com/trail-b1az3r/vivify-quest.git vivify
          git -C vivify checkout --detach "$VIVIFY_REVISION"
          cd vivify

          # Use the dedicated 1.45.3 dependency target. CustomJSONData and
          # Tracks are supplied by the already-built local ports from this run.
          python3 scripts/use-game-target.py 1.45.3 \
            --local custom-json-data=0.24.6 \
            --local tracks=2.5.5
          rm -rf extern extern.cmake qpm.shared.json
          cp mod.json mod.target.json

          qpm ndk resolve -d
          qpm restore --update

          # Build the full feature set first.
          cmake -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -B build .
          cmake --build build --parallel
          FULL_SO="$(find build -name 'libVivify.so' -print -quit)"
          test -n "$FULL_SO"
          python3 scripts/check-so-dependencies.py "$FULL_SO"
          mkdir -p ../artifacts
          cp mod.json ../artifacts/vivify-mod-full.json
          zip -j ../artifacts/Vivify-0.15.48-bs1.45.3.qmod mod.json "$FULL_SO"

          # Build the upstream Lite feature set separately from a clean CMake
          # directory so VIVIFY_LITE cannot leak from one build into the other.
          rm -rf build
          VIVIFY_GAME_TARGET=1.45.3 VIVIFY_LITE=1 \
            cmake -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -B build .
          VIVIFY_GAME_TARGET=1.45.3 VIVIFY_LITE=1 \
            cmake --build build --parallel
          LITE_SO="$(find build -name 'libVivify.so' -print -quit)"
          test -n "$LITE_SO"
          python3 scripts/check-so-dependencies.py "$LITE_SO"
          grep -aq ' (lite)' "$LITE_SO"
          python3 - <<'PY'
          import json
          p = "mod.json"
          data = json.load(open(p))
          data["name"] = "Vivify Lite"
          json.dump(data, open(p, "w"), indent=2)
          PY
          zip -j ../artifacts/Vivify-Lite-0.15.48-bs1.45.3.qmod mod.json "$LITE_SO"
          cp mod.target.json mod.json

          # Both packages must contain an ARM64 native library.
          python3 - <<'PY'
          import pathlib, struct, zipfile
          for path in sorted(pathlib.Path("../artifacts").glob("Vivify*.qmod")):
              with zipfile.ZipFile(path) as z:
                  libs = [z.read(n) for n in z.namelist() if n.endswith(".so")]
              if not libs or not any(
                  len(b) >= 20 and b[:4] == b"\x7fELF" and b[4] == 2 and
                  b[5] == 1 and struct.unpack("<H", b[18:20])[0] == 183
                  for b in libs
              ):
                  raise SystemExit(f"ARM64 QMOD validation failed: {path}")
              print(f"Validated Vivify QMOD: {path}")
          PY

      - name: Upload builds and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: operation-beat-saver-results
          path: |
            artifacts/
            reports/
          if-no-files-found: warn
          retention-days: 14

  custommodels:
    name: Build CustomModels separately for Beat Saber 1.45.3
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CUSTOMMODELS_REVISION: "28c049c2d24e0d9a0172d42db07ec80e72a3d62d"
      ANDROID_NDK_VERSION: "29.0.14206865"
      PACKAGE_VERSION: "1.45.3_30054"
      CORDL_RANGE: "^4503.0.0"
      HOOK_RANGE: "^9.3.0"

    steps:
      - name: Checkout pinned CustomModels source
        uses: actions/checkout@v4
        with:
          repository: Metalit/CustomModels
          ref: 28c049c2d24e0d9a0172d42db07ec80e72a3d62d
          path: CustomModels
          submodules: true
          lfs: true

      - name: Set up Android SDK and pinned NDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install pinned NDK
        run: |
          sdkmanager --install "platform-tools" "ndk;${ANDROID_NDK_VERSION}"
          NDK_PATH="$ANDROID_SDK_ROOT/ndk/$ANDROID_NDK_VERSION"
          test -f "$NDK_PATH/source.properties"
          {
            echo "ANDROID_NDK_HOME=$NDK_PATH"
            echo "ANDROID_NDK_ROOT=$NDK_PATH"
            echo "ANDROID_NDK_LATEST_HOME=$NDK_PATH"
          } >> "$GITHUB_ENV"
          grep "Pkg.Revision" "$NDK_PATH/source.properties"

      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build build-essential binutils
          cmake --version
          ninja --version
          readelf --version

      - name: Install QPM and verify source revision
        working-directory: CustomModels
        run: |
          set -euo pipefail
          curl -fsSL -o qpm.zip https://github.com/QuestPackageManager/QPM.CLI/releases/download/v1.5.11/qpm-linux-x64.zip
          unzip -oq qpm.zip -d /tmp/qpm
          QPM_BIN="$(find /tmp/qpm -type f -name qpm -print -quit)"
          test -n "$QPM_BIN"
          sudo install -m 755 "$QPM_BIN" /usr/local/bin/qpm
          test "$(git rev-parse HEAD)" = "$CUSTOMMODELS_REVISION"
          qpm --version
          cmake --version
          ninja --version
          pwsh --version

      - name: Align only the Beat Saber toolchain and refresh dependency lock
        working-directory: CustomModels
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path

          qpm_path = Path("qpm.json")
          shared_path = Path("qpm.shared.json")
          qpm = json.loads(qpm_path.read_text())
          shared = json.loads(shared_path.read_text())

          def align(config):
              config.setdefault("workspace", {})["ndk"] = "^29.0.0"
              target_ranges = {
                  "beatsaber-hook": os.environ["HOOK_RANGE"],
                  "bs-cordl": os.environ["CORDL_RANGE"],
                  # The 1.45.3 mod catalog requires MetaCore 2.0.6.
                  # CustomModels' upstream lockfile still pins MetaCore 1.4.0,
                  # which cannot coexist with the installed core-mod graph.
                  "metacore": "^2.0.6",
                  "custom-types": "^0.21.2",
                  # Lapiz 0.3.7 is the current line for Hook 9 / Cordl 4503
                  # and supports CustomTypes 0.21.x (unlike Lapiz 0.2.x).
                  "lapiz": "^0.3.7",
                  "paper2_scotland2": "^4.8.0",
                  # rapidjson-macros 2.1.0 requires Hook 6.x; v3.0.0 is
                  # the compatible release used by current Hook 9.3 projects.
                  "rapidjson-macros": "^3.0.0",
                  # config-utils 2.x requires Hook 7.x and RapidJSON macros
                  # 2.x; use the verified 3.0.0 line for Hook 9 projects.
                  "config-utils": "^3.0.0",
                  # BSML 0.4.x hard-pins CustomTypes 0.18.x; 0.6.7
                  # supports the 0.21.x API used by this Beat Saber target.
                  "bsml": "^0.6.7",
              }
              for dep in config.get("dependencies", []):
                  dep_id = dep.get("id")
                  if dep_id in target_ranges:
                      dep["versionRange"] = target_ranges[dep_id]

          align(qpm)
          align(shared["config"])

          # Refresh the complete dependency graph so the generated QMOD no
          # longer carries the incompatible MetaCore 1.4.0 dependency lock.
          qpm_path.write_text(json.dumps(qpm, indent=2) + "\n")
          shared_path.write_text(json.dumps(shared, indent=2) + "\n")

          template = json.loads(Path("mod.template.json").read_text())
          template["packageVersion"] = os.environ["PACKAGE_VERSION"]
          Path("mod.template.json").write_text(json.dumps(template, indent=2) + "\n")
          PY
          qpm ndk resolve -d
          qpm restore --update

      - name: Verify resolved dependencies and normalize the zip library input
        working-directory: CustomModels
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, re
          from pathlib import Path

          shared = json.loads(Path("qpm.shared.json").read_text())
          resolved = {
              item.get("dependency", {}).get("id"): item.get("version", "")
              for item in shared.get("restoredDependencies", [])
          }
          minimums = {
              "beatsaber-hook": "9.3.0",
              "bs-cordl": "4503.0.0",
              "metacore": "2.0.6",
              "custom-types": "0.21.2",
              "lapiz": "0.3.7",
              "rapidjson-macros": "3.0.0",
              "config-utils": "3.0.0",
              "bsml": "0.6.7",
              "paper2_scotland2": "4.8.0",
          }

          def version_tuple(value):
              match = re.match(r"^(\\d+)\\.(\\d+)\\.(\\d+)", value or "")
              return tuple(map(int, match.groups())) if match else None

          failures = []
          for dep_id, minimum in minimums.items():
              actual = resolved.get(dep_id, "")
              actual_tuple = version_tuple(actual)
              minimum_tuple = version_tuple(minimum)
              print(f"{dep_id}: {actual or 'MISSING'} (minimum {minimum})")
              if actual_tuple is None or actual_tuple < minimum_tuple:
                  failures.append(f"{dep_id}: expected >= {minimum}, resolved {actual or 'missing'}")
          if failures:
              raise SystemExit("Dependency graph is not aligned:\\n" + "\\n".join(failures))
          PY

          # CustomModels' CMakeLists.txt still consumes this legacy filename
          # during its post-build step. The pinned QPM zip package only
          # publishes the regular libzip.so, not a separate debugSoLink.
          if [[ ! -s extern/libs/libzip.so ]]; then
            if [[ -s extern/libs/libzip.so.so ]]; then
              cp extern/libs/libzip.so.so extern/libs/libzip.so
            else
              echo "QPM did not restore extern/libs/libzip.so"
              find extern/libs -maxdepth 1 -type f -printf '%f\\n' | sort || true
              exit 1
            fi
          fi
          cp -f extern/libs/libzip.so extern/libs/libzip.debug.so
          test -s extern/libs/libzip.debug.so

      - name: Add missing standard vector include to CustomModels zip header
        working-directory: CustomModels
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path("include/zip.hpp")
          data = path.read_text()
          missing = [header for header in ("vector", "utility") if f"#include <{header}>" not in data]
          if missing:
              anchor = "#include <string>"
              if data.count(anchor) != 1:
                  raise SystemExit("Expected exactly one <string> include in include/zip.hpp")
              addition = "".join(f"\n#include <{header}>" for header in missing)
              path.write_text(data.replace(anchor, anchor + addition, 1))
              print("Added required standard headers: " + ", ".join(missing))
          else:
              print("zip.hpp already includes vector and utility")
          PY

      - name: Verify resolved headers without stale source rewrites
        working-directory: CustomModels
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          cache = Path.home() / ".local/share/QPM-RS/cache"
          print("Project headers:")
          for root in (Path("include"), Path("extern"), cache):
              if root.exists():
                  for name in ("il2cpp-utils-methods.hpp", "typedefs-list.hpp", "RegistrationHelper.hpp"):
                      hits = list(root.rglob(name))
                      for hit in hits[:10]:
                          print(hit)
          print("Proceeding with the resolved Hook 9 / Cordl 4503 headers as published.")
          PY

      - name: Build CustomModels native library
        working-directory: CustomModels
        run: |
          set -euo pipefail
          test -f qpm_defines.cmake
          rm -rf build
          cmake -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DHOT_RELOAD=OFF -B build .
          cmake --build build --parallel
          LIBRARY="$(find build -type f -name 'libcustommodels.so' -print -quit)"
          test -n "$LIBRARY"
          file "$LIBRARY"
          readelf -h "$LIBRARY" | grep -E 'Class:|Machine:'

      - name: Create and validate CustomModels QMOD
        working-directory: CustomModels
        run: |
          set -euo pipefail
          pwsh ./scripts/createqmod.ps1 -QmodName CustomModels
          python3 - <<'PY'
          import pathlib, struct, zipfile
          path = pathlib.Path("CustomModels.qmod")
          if not path.is_file():
              raise SystemExit("CustomModels.qmod was not created")
          with zipfile.ZipFile(path) as archive:
              names = archive.namelist()
              libs = [archive.read(name) for name in names if name.endswith("libcustommodels.so")]
          if not libs:
              raise SystemExit("QMOD does not contain libcustommodels.so")
          valid = any(
              len(data) >= 20 and data[:4] == b"\x7fELF" and
              data[4] == 2 and data[5] == 1 and
              struct.unpack("<H", data[18:20])[0] == 183
              for data in libs
          )
          if not valid:
              raise SystemExit("CustomModels QMOD does not contain an ARM64 ELF library")
          print("Validated ARM64 CustomModels QMOD:", path)
          print("QMOD entries:", names)
          PY
          mkdir -p ../artifacts
          cp CustomModels.qmod ../artifacts/

      - name: Upload CustomModels build and QMOD
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: custommodels-bs1.45.3
          path: |
            CustomModels/build/
            CustomModels/CustomModels.qmod
          if-no-files-found: warn
          retention-days: 14
