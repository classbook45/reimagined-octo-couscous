name: NoodleExtensions — Crash Fix Build

on:
  workflow_call:
    inputs:
      package_version:
        type: string
        required: false
        default: "1.45.3_30054"
  push:
    branches: [main]
    paths:
      - ".github/workflows/vr-beat-saver.yml"
      - ".github/operation-beat-saver/patches/NoodleExtensions.patch"
  workflow_dispatch:
    inputs:
      package_version:
        description: "Beat Saber package version"
        type: string
        required: true
        default: "1.45.3_30054"

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  noodle-only:
    name: Patch and build NoodleExtensions only
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PACKAGE_VERSION: ${{ inputs.package_version || '1.45.3_30054' }}
      ANDROID_NDK_VERSION: "29.0.14206865"
      PORTS_REPOSITORY: "https://github.com/trail-b1az3r/ports-"
      PORTS_REVISION: "c3bcdffbaf90d6c3bc2d70f68fcf6cb2da0341e3"

    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Install Android SDK and pinned NDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install NDK
        run: |
          sdkmanager --install "platform-tools" "ndk;${ANDROID_NDK_VERSION}"
          NDK_PATH="$ANDROID_SDK_ROOT/ndk/$ANDROID_NDK_VERSION"
          test -f "$NDK_PATH/source.properties"
          {
            echo "ANDROID_NDK_HOME=$NDK_PATH"
            echo "ANDROID_NDK_ROOT=$NDK_PATH"
            echo "ANDROID_NDK_LATEST_HOME=$NDK_PATH"
          } >> "$GITHUB_ENV"
          grep "Pkg.Revision" "$NDK_PATH/source.properties"

      - name: Install QPM
        run: |
          curl -fsSL -o qpm.zip https://github.com/QuestPackageManager/QPM.CLI/releases/latest/download/qpm-linux-x64.zip
          unzip -oq qpm.zip -d /tmp/qpm
          QPM_BIN="$(find /tmp/qpm -type f -name qpm -print -quit)"
          test -n "$QPM_BIN"
          sudo install -m 755 "$QPM_BIN" /usr/local/bin/qpm
          qpm --version

      - name: Fetch pinned 1.45.3 NoodleExtensions source
        run: |
          git init ports
          git -C ports remote add origin "$PORTS_REPOSITORY"
          git -C ports fetch --depth 1 origin "$PORTS_REVISION"
          git -C ports checkout --detach FETCH_HEAD
          test "$(git -C ports rev-parse HEAD)" = "$PORTS_REVISION"
          test -d ports/NoodleExtensions

      - name: Apply and verify the NoodleExtensions crash fix
        run: |
          PATCH="$GITHUB_WORKSPACE/.github/operation-beat-saver/patches/NoodleExtensions.patch"
          test -s "$PATCH"
          git -C ports apply --check --directory=NoodleExtensions "$PATCH"
          git -C ports apply --verbose --directory=NoodleExtensions "$PATCH"
          grep -Fq 'if (beatmapOpt && (controller != selfController || selfController->_beatmapData != beatmapData)) {' ports/NoodleExtensions/src/Hooks/BeatmapObjectCallBackController.cpp
          git -C ports diff --check
          git -C ports diff -- NoodleExtensions/src/Hooks/BeatmapObjectCallBackController.cpp

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch and prepare Tracks dependency
        run: |
          git clone --depth 1 --branch master https://github.com/bsq-ports/Tracks.git ports/Tracks
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("ports/Tracks/qpm.json")
          data = json.loads(path.read_text())
          info = data.setdefault("info", {})
          old_version = info.get("version", "0.0.0")
          parts = old_version.split("+", 1)
          nums = parts[0].split(".")
          try:
              nums[-1] = str(int(nums[-1]) + 1)
          except ValueError:
              nums.append("1")
          info["version"] = ".".join(nums) + (("+" + parts[1]) if len(parts) > 1 else "")

          ranges = {
              "bs-cordl": "^4503.0.0",
              "beatsaber-hook": "^6.4.2",
              "custom-types": "^0.21.2",
              "config-utils": "^3.0.0",
              "bsml": "^0.4.54",
              "songcore": "^1.1.23",
              "paper2_scotland2": "^4.6.4",
              "scotland2": "^0.1.6",
          }
          for dep in data.get("dependencies", []):
              dep_id = dep.get("id")
              if dep_id in ranges:
                  dep["versionRange"] = ranges[dep_id]
          data.setdefault("workspace", {})["ndk"] = "^29.0.0"
          path.write_text(json.dumps(data, indent=2) + "\n")
          print("Prepared Tracks dependency:", info["version"])
          PY
          mkdir -p ports/Tracks/shared
          qpm restore --directory ports/Tracks

      - name: Build Tracks dependency first
        run: |
          qpm s build --directory ports/Tracks

      - name: Point NoodleExtensions at the locally built Tracks dependency
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("ports/NoodleExtensions/qpm.json")
          data = json.loads(path.read_text())
          info = data.setdefault("info", {})
          old_version = info.get("version", "0.0.0")
          parts = old_version.split("+", 1)
          nums = parts[0].split(".")
          try:
              nums[-1] = str(int(nums[-1]) + 1)
          except ValueError:
              nums.append("1")
          info["version"] = ".".join(nums) + (("+" + parts[1]) if len(parts) > 1 else "")
          data.setdefault("workspace", {})["ndk"] = "^29.0.0"

          for dep in data.get("dependencies", []):
              if dep.get("id") == "tracks":
                  additional = dep.setdefault("additionalData", {})
                  additional["localPath"] = str(Path("ports/Tracks").resolve())
                  dep["versionRange"] = "*"
                  break
          else:
              raise SystemExit("NoodleExtensions qpm.json does not declare Tracks")

          path.write_text(json.dumps(data, indent=2) + "\n")
          print("NoodleExtensions will use local Tracks:", Path("ports/Tracks").resolve())
          PY

      - name: Restore NoodleExtensions dependencies
        working-directory: ports/NoodleExtensions
        run: |
          mkdir -p shared
          qpm restore

      - name: Build NoodleExtensions only
        working-directory: ports/NoodleExtensions
        run: |
          qpm s build

      - name: Package NoodleExtensions QMOD
        working-directory: ports/NoodleExtensions
        run: |
          qpm qmod zip
          test -f NoodleExtensions.qmod
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          cp NoodleExtensions.qmod "$GITHUB_WORKSPACE/artifacts/NoodleExtensions-crash-fix.qmod"
          {
            echo "NoodleExtensions crash-fix build"
            echo "Beat Saber package: $PACKAGE_VERSION"
            echo "Source revision: $PORTS_REVISION"
            echo "Patch applied and verified: yes"
            echo "Built project: NoodleExtensions only"
          } > "$GITHUB_WORKSPACE/artifacts/build-report.txt"

      - name: Upload NoodleExtensions artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: noodleextensions-crash-fix
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
