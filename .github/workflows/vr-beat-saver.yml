name: VR Beat Saver — Operation Beat Saver (Noodle Fix)

on:
  workflow_call:
    inputs:
      package_version:
        type: string
        required: false
        default: "1.45.3_30054"
      cordl_range:
        type: string
        required: false
        default: "^4503.0.0"
      hook_range:
        type: string
        required: false
        default: "^9.3.0"
  push:
    branches: [main]
    paths:
      - '.github/workflows/vr-beat-saver.yml'
      - '.github/operation-beat-saver/patches/**'
      - '.github/operation-beat-saver/scripts/**'
  workflow_dispatch:
    inputs:
      package_version:
        description: "Beat Saber package version"
        required: true
        default: "1.45.3_30054"
      cordl_range:
        description: "Target bs-cordl range"
        required: true
        default: "^4503.0.0"
      hook_range:
        description: "Target beatsaber-hook range"
        required: true
        default: "^9.3.0"

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  operation-beat-saver:
    name: Inspect, patch and build Quest mods
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PACKAGE_VERSION: ${{ inputs.package_version || '1.45.3_30054' }}
      CORDL_RANGE: ${{ inputs.cordl_range || '^4503.0.0' }}
      HOOK_RANGE: ${{ inputs.hook_range || '^9.3.0' }}
      ANDROID_NDK_VERSION: "29.0.14206865"

    steps:
      - name: Checkout workflow and compatibility patches
        uses: actions/checkout@v4

      - name: Set up Python and Java
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install pinned Android NDK 29
        run: |
          python3 "$GITHUB_WORKSPACE/.github/operation-beat-saver/scripts/autofix_stage.py" --stage "00-install-pinned-android-ndk" --script "$GITHUB_WORKSPACE/.github/operation-beat-saver/scripts/stages/00-install-pinned-android-ndk.sh"

      - name: Install QPM CLI
        run: |
          python3 "$GITHUB_WORKSPACE/.github/operation-beat-saver/scripts/autofix_stage.py" --stage "00b-install-qpm-cli" --script "$GITHUB_WORKSPACE/.github/operation-beat-saver/scripts/stages/00b-install-qpm-cli.sh"

      - name: Prepare CustomModels-only build directories
        run: |
          python3 "$GITHUB_WORKSPACE/.github/operation-beat-saver/scripts/autofix_stage.py" --stage "01-prepare-custommodels-only-build-directories" --script "$GITHUB_WORKSPACE/.github/operation-beat-saver/scripts/stages/01-prepare-custommodels-only-build-directories.sh"
      - name: Clone pinned CustomModels source into Operation Beat Saver
        env:
          CUSTOMMODELS_REVISION: "28c049c2d24e0d9a0172d42db07ec80e72a3d62d"
        run: |
          python3 "$GITHUB_WORKSPACE/.github/operation-beat-saver/scripts/autofix_stage.py" --stage "02-clone-pinned-custommodels-source-into-operation-beat-saver" --script "$GITHUB_WORKSPACE/.github/operation-beat-saver/scripts/stages/02-clone-pinned-custommodels-source-into-operation-beat-saver.sh"
      - name: Prepare CustomModels native build tools
        run: |
          python3 "$GITHUB_WORKSPACE/.github/operation-beat-saver/scripts/autofix_stage.py" --stage "03-prepare-custommodels-native-build-tools" --script "$GITHUB_WORKSPACE/.github/operation-beat-saver/scripts/stages/03-prepare-custommodels-native-build-tools.sh"
      - name: Align only the Beat Saber toolchain and refresh dependency lock
        working-directory: CustomModels
        run: |
          python3 "$GITHUB_WORKSPACE/.github/operation-beat-saver/scripts/autofix_stage.py" --stage "04-align-only-the-beat-saber-toolchain-and-refresh-dependency-lock" --script "$GITHUB_WORKSPACE/.github/operation-beat-saver/scripts/stages/04-align-only-the-beat-saber-toolchain-and-refresh-dependency-lock.sh"
      - name: Verify resolved dependencies and normalize the zip library input
        working-directory: CustomModels
        run: |
          python3 "$GITHUB_WORKSPACE/.github/operation-beat-saver/scripts/autofix_stage.py" --stage "05-verify-resolved-dependencies-and-normalize-the-zip-library-input" --script "$GITHUB_WORKSPACE/.github/operation-beat-saver/scripts/stages/05-verify-resolved-dependencies-and-normalize-the-zip-library-input.sh"
      - name: Add missing standard vector include to CustomModels zip header
        working-directory: CustomModels
        run: |
          python3 "$GITHUB_WORKSPACE/.github/operation-beat-saver/scripts/autofix_stage.py" --stage "06-add-missing-standard-vector-include-to-custommodels-zip-header" --script "$GITHUB_WORKSPACE/.github/operation-beat-saver/scripts/stages/06-add-missing-standard-vector-include-to-custommodels-zip-header.sh"
      - name: Verify resolved headers without stale source rewrites
        working-directory: CustomModels
        run: |
          python3 "$GITHUB_WORKSPACE/.github/operation-beat-saver/scripts/autofix_stage.py" --stage "07-verify-resolved-headers-without-stale-source-rewrites" --script "$GITHUB_WORKSPACE/.github/operation-beat-saver/scripts/stages/07-verify-resolved-headers-without-stale-source-rewrites.sh"
      - name: Enable C++23 required by Hook 9.3
        working-directory: CustomModels
        run: |
          python3 "$GITHUB_WORKSPACE/.github/operation-beat-saver/scripts/autofix_stage.py" --stage "08-enable-c-23-required-by-hook-9-3" --script "$GITHUB_WORKSPACE/.github/operation-beat-saver/scripts/stages/08-enable-c-23-required-by-hook-9-3.sh"
      - name: Migrate Hook 9 header locations used by CustomModels
        working-directory: CustomModels
        run: |
          python3 "$GITHUB_WORKSPACE/.github/operation-beat-saver/scripts/autofix_stage.py" --stage "09-migrate-hook-9-header-locations-used-by-custommodels" --script "$GITHUB_WORKSPACE/.github/operation-beat-saver/scripts/stages/09-migrate-hook-9-header-locations-used-by-custommodels.sh"
      - name: Link reflect-cpp and include Cordl IList implementation
        working-directory: CustomModels
        run: |
          python3 "$GITHUB_WORKSPACE/.github/operation-beat-saver/scripts/autofix_stage.py" --stage "11-link-reflect-cpp-and-include-cordl-ilist-implementation" --script "$GITHUB_WORKSPACE/.github/operation-beat-saver/scripts/stages/11-link-reflect-cpp-and-include-cordl-ilist-implementation.sh"
      - name: Build CustomModels native library with bounded auto-fixes
        working-directory: CustomModels
        run: |
          python3 "$GITHUB_WORKSPACE/.github/operation-beat-saver/scripts/autofix_stage.py" --stage "12-build-custommodels-native-library-with-bounded-auto-fixes" --script "$GITHUB_WORKSPACE/.github/operation-beat-saver/scripts/stages/12-build-custommodels-native-library-with-bounded-auto-fixes.sh"
      - name: Create and validate CustomModels QMOD
        working-directory: CustomModels
        run: |
          python3 "$GITHUB_WORKSPACE/.github/operation-beat-saver/scripts/autofix_stage.py" --stage "13-create-and-validate-custommodels-qmod" --script "$GITHUB_WORKSPACE/.github/operation-beat-saver/scripts/stages/13-create-and-validate-custommodels-qmod.sh"
      - name: Upload builds and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: operation-beat-saver-results
          path: |
            artifacts/
            reports/
          if-no-files-found: warn
          retention-days: 14
